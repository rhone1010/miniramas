<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liten & Co — Soft Launch</title>
<link rel="icon" type="image/png" href="/gate/fav_ico.png">

<style>
:root{
  --paper:#efe0c7;
  --paper-light:#f6ead7;
  --ink:#382117;
  --coffee:#351d12;
  --gold:#b58a4c;
  --muted:#765944;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:4vh 4vw;
  background:
    radial-gradient(circle at 50% 18%,rgba(176,126,70,.18),transparent 28%),
    linear-gradient(#21140d,#120b08);
  font-family:Georgia,"Times New Roman",serif;
}

.gate{
  position:relative;
  width:min(74vw,930px);
  aspect-ratio:1110/1400;
  overflow:hidden;
  border-radius:3.3%;
  background:
    radial-gradient(circle at 50% 9%,rgba(255,255,255,.40),transparent 32%),
    linear-gradient(180deg,var(--paper-light),var(--paper));
  border:1px solid rgba(95,57,31,.72);
  box-shadow:0 34px 90px rgba(0,0,0,.54),
             inset 0 0 0 1px rgba(255,255,255,.30);
}

.gate:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
  border-radius:inherit;
  box-shadow:inset 0 0 44px rgba(77,46,26,.10);
}

/* PORTRAITS */
.figure{
  position:absolute;
  z-index:1;
  bottom:20%;
  width:48%;
  height:68%;
  background-repeat:no-repeat;
  background-size:contain;
}

.figure-left{
  left:-4%;
  background-image:url("/gate/gate_woman_image.png");
  background-position:left bottom;
}

.figure-right{
  right:-4%;
  background-image:url("/gate/gate_man_image.png");
  background-position:right bottom;
}

/* soft paper blend over lower portraits */
.figure-fade{
  position:absolute;
  z-index:2;
  left:0;
  right:0;
  bottom:17%;
  height:27%;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    rgba(239,224,199,0) 0%,
    rgba(239,224,199,.18) 18%,
    rgba(239,224,199,.72) 62%,
    var(--paper) 92%
  );
}

.content{
  position:absolute;
  inset:0;
  z-index:5;
  color:var(--ink);
  text-align:center;
}

/* ACTUAL BRAND SVG */
.logo-wrap{
  position:absolute;
  top:5.2%;
  left:50%;
  width:48%;
  transform:translateX(-50%);
}

.brand-logo{
  display:block;
  width:68%;
  max-height:105px;
  object-fit:contain;
  margin:0 auto;
}

.brand-rule{
  position:relative;
  width:43%;
  height:1px;
  margin:4% auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.brand-rule:after{
  content:"◆";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-52%);
  padding:0 .55em;
  background:var(--paper-light);
  color:var(--gold);
  font-size:11px;
}

/* CENTER COPY */
.invite{
  position:absolute;
  top:28.5%;
  left:50%;
  width:43%;
  transform:translateX(-50%);
}

.invite h1{
  margin:0 0 3%;
  font-size:clamp(33px,4vw,52px);
  line-height:1.05;
  font-weight:500;
  letter-spacing:-.025em;
}

.soft{
  margin:0 0 7%;
  font-size:clamp(17px,1.9vw,24px);
  font-style:italic;
  color:#624532;
}

.copy{
  margin:0;
  font-size:clamp(14px,1.45vw,19px);
  line-height:1.48;
  color:#4f382a;
}

/* PASSCODE AREA */
.form{
  position:absolute;
  left:50%;
  bottom:6.2%;
  width:65.5%;
  transform:translateX(-50%);
  text-align:left;
}

.form label{
  display:block;
  margin-bottom:1.7%;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(11px,1.05vw,14px);
  font-weight:700;
  letter-spacing:.17em;
  color:#6d4932;
}

.input-shell{position:relative}

input{
  width:100%;
  height:clamp(62px,6.8vw,80px);
  padding:0 4.3rem 0 1.45rem;
  border:1px solid rgba(92,56,35,.58);
  border-radius:14px;
  outline:none;
  background:rgba(255,255,255,.48);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
  color:var(--ink);
  font:inherit;
  font-size:clamp(18px,1.75vw,23px);
}

input::placeholder{color:#9b897a}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(181,138,76,.15);
}

.eye{
  position:absolute;
  right:1.25rem;
  top:50%;
  transform:translateY(-50%);
  padding:0;
  border:0;
  background:transparent;
  color:#68452f;
  cursor:pointer;
  font-size:1.5rem;
}

.unlock{
  width:100%;
  height:clamp(62px,6.7vw,79px);
  margin-top:3.2%;
  border:0;
  border-radius:13px;
  cursor:pointer;
  background:linear-gradient(180deg,#4b2a1a,#28150e);
  box-shadow:0 9px 20px rgba(52,29,17,.18);
  color:#e0be83;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(14px,1.35vw,18px);
  font-weight:500;
  letter-spacing:.18em;
}

.unlock:hover{filter:brightness(1.06)}

.bottom-rule{
  display:flex;
  align-items:center;
  gap:12px;
  width:92%;
  margin:4.4% auto 2.2%;
  color:var(--gold);
}

.bottom-rule:before,
.bottom-rule:after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(181,138,76,.58));
}

.bottom-rule:after{transform:scaleX(-1)}

.leaf{
  font-size:17px;
  transform:rotate(-18deg);
}

.thanks{
  text-align:center;
  color:#78583e;
  font-size:clamp(14px,1.4vw,18px);
  font-style:italic;
}

@media(max-width:760px){
  body{padding:0}

  .gate{
    width:100vw;
    min-height:100vh;
    aspect-ratio:auto;
    border-radius:0;
  }

  .figure{
    width:58%;
    height:55%;
    bottom:27%;
    opacity:.52;
  }

  .figure-left{left:-13%}
  .figure-right{right:-13%}

  .logo-wrap{
    top:5%;
    width:72%;
  }

  .invite{
    top:27%;
    width:64%;
  }

  .form{
    width:84%;
    bottom:6%;
  }
}
</style>
</head>

<body>

<main class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">

  <div class="figure figure-left" aria-hidden="true"></div>
  <div class="figure figure-right" aria-hidden="true"></div>
  <div class="figure-fade" aria-hidden="true"></div>

  <section class="content">

    <div class="logo-wrap">
      <img
        class="brand-logo"
        src="/gate/liten-and-co.svg"
        alt="Liten & Co">
      <div class="brand-rule"></div>
    </div>

    <div class="invite">
      <h1 id="gate-title">You’re Invited</h1>
      <p class="soft">Liten & Co is in soft launch.</p>

      <p class="copy">
        We’re opening our doors to a select<br>
        group of testers and family.
        <br><br>
        Enter your passcode to explore.
      </p>
    </div>

    <form class="form" id="gate-form">

      <label for="passcode">PASSCODE</label>

      <div class="input-shell">
        <input
          id="passcode"
          name="passcode"
          type="password"
          placeholder="Enter passcode"
          autocomplete="current-password">

        <button
          class="eye"
          type="button"
          id="toggle-passcode"
          aria-label="Show passcode">◉</button>
      </div>

      <button class="unlock" type="submit">
        UNLOCK ACCESS
      </button>

      <div class="bottom-rule">
        <span class="leaf">❧</span>
      </div>

      <div class="thanks">
        Thank you for helping us shape something beautiful.
      </div>

    </form>

  </section>
</main>

<script>
const input = document.getElementById("passcode");
const toggle = document.getElementById("toggle-passcode");

toggle.addEventListener("click", () => {
  const hidden = input.type === "password";
  input.type = hidden ? "text" : "password";
  toggle.textContent = hidden ? "◎" : "◉";
  toggle.setAttribute(
    "aria-label",
    hidden ? "Hide passcode" : "Show passcode"
  );
});

/*
  Connect your actual gate validation here.
*/
document.getElementById("gate-form").addEventListener("submit", (event) => {
  event.preventDefault();

  // Example:
  // validatePasscode(input.value);
});
</script>

</body>
</html>
