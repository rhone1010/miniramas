<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ceramic Mug · Single Image</title><style>body{margin:0;background:#f7f3ea;color:#293c2c;font-family:Georgia,serif}main{max-width:900px;margin:auto;padding:24px}h1,h2{font-weight:400}h1{font-size:38px}h2{font-size:28px}p{font:16px/1.5 sans-serif}img{display:block;width:100%;height:auto;border-radius:5px}section{margin:32px 0}a{color:inherit}small{font:14px/1.5 sans-serif}@media(max-width:600px){main{padding:16px}}</style></head><body><main><h1>Ceramic Mug</h1><p>One image · White reverse · Original photographic background</p><p>Development preview. Panel dimensions await the matching print-layout contract. Existing sample artwork is shown whole, at its original proportions.</p><div id="examples"></div></main><script type="module">
import {mugPanelPreview} from '/gift-wizard/mug-panel.next.js';
const placement={centerX:902.4,centerY:1100,radiusX:520.96,maxWidth:850,maxHeight:1000,curveDepth:42,lightRow:550};
for(const [name,url] of [['Portrait','/panel-portrait.jpg'],['Square','/panel-square.jpg'],['Landscape','/groups_219_impressionist_16/original.png']]){
 const section=document.createElement('section');section.innerHTML='<h2>'+name+'</h2><p role="status">Preparing preview…</p>';document.querySelector('#examples').append(section);
 try{const output=await mugPanelPreview(url,placement);section.querySelector('p').remove();const link=document.createElement('a');link.href=output;link.target='_blank';link.rel='noopener';const img=new Image();img.src=output;img.alt=name+' artwork on mug';link.append(img);section.append(link);const original=document.createElement('a');original.href=url;original.target='_blank';original.textContent='Original artwork';section.append(original);}catch(e){section.querySelector('p').textContent=e.message;}
}
</script></body></html>
