<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liten & Co · Portraits — Five-Spine Architecture</title>
<!--
  PROTOTYPE — Rich's five-spine spec 2026-06-14. Throw away. Mock data.

  Five elements:
    1. Advanced       (left spine, always closed unless clicked, max 200px)
    2. Source+Curator (auto-open at upload; shrinks to 200px when Suggested appears)
    3. Suggested      (60% of stage; 3-per-row, cards capped at 350px)
    4. Queue          (does not exist until first add; becomes hero on Craft)
    5. My Collection  (cross-Series archive; current series 50% larger)

  Two coordinated phases:
    Phase 1 — composing  (Advanced spine | Source+Curator | Suggested | Queue if any)
    Phase 2 — crafting   (Advanced spine | Curator spine | Suggested spine | Queue takes stage)
                         pieces animate from Queue → My Collection (peek tray)

  Stage toggle at top flips between Upload, Composing, Crafting, Collection.
-->
<style>
:root {
  --bg:#f3ede1; --ink:#2a241e; --ink-2:#5a5246; --ink-3:#8a8174;
  --border:#cbbe9f; --frame:#aba39a;
  --oxblood:#7d4242; --oxblood-dark:#5e3133;
  --brass:#75623a; --sand:#c4a96e;
  --vellum:#ede6d6; --chip:#d0c29d;
  --sage:#6a7a55; --sage-tint:#e2e6d4; --sage-border:#a8b48d;
  --good:#7c9c5e; --warn:#b8923a; --bad:#a64e4e;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:ui-monospace, 'SF Mono', Menlo, monospace;
  --shadow-card:0 4px 14px rgba(42,36,30,.08);
  --shadow-hero:0 10px 28px rgba(42,36,30,.14);
  --t-fast:.25s cubic-bezier(.4,0,.2,1);
  --t-base:.45s cubic-bezier(.4,0,.2,1);
  --t-slow:.6s cubic-bezier(.4,0,.2,1);
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; }

/* ── TOPBAR ───────────────────────────────────────────────────── */
.topbar{
  position:sticky; top:0; z-index:200;
  display:flex; align-items:center; gap:18px;
  padding:10px 22px; background:var(--bg);
  border-bottom:1px solid var(--border);
  font-size:14px;
}
.brand{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:21px; color:var(--ink);
}
.brand-sub{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); margin-left:10px;
}
.proto-badge{
  font-family:var(--mono); font-size:11px;
  background:#fff3d0; color:#7a5a1a; padding:3px 8px;
  border:1px solid #d9bf6a; border-radius:3px; margin-left:14px;
}
.stage-toggle{ display:flex; gap:0; margin-left:auto; }
.stage-toggle button{
  font-family:'Cormorant Garamond', serif; font-style:italic; font-size:14px;
  padding:6px 13px; background:#fff; color:var(--ink-2);
  border:1px solid var(--border); border-right-width:0; cursor:pointer;
}
.stage-toggle button:first-child{ border-radius:5px 0 0 5px; }
.stage-toggle button:last-child{ border-radius:0 5px 5px 0; border-right-width:1px; }
.stage-toggle button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

/* ── APP ──────────────────────────────────────────────────────── */
.app{
  display:flex; min-height:calc(100vh - 56px);
}

/* ── SPINE — the common collapsed form ─────────────────────────── */
.spine{
  flex:0 0 48px; background:var(--vellum); border-right:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background .2s ease, flex-basis var(--t-base);
}
.spine:hover{ background:#e6dec9; }
.spine-label{
  writing-mode:vertical-rl; text-orientation:mixed;
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:15px; color:var(--oxblood); letter-spacing:.04em;
  white-space:nowrap;
}

/* ── ADVANCED PANEL (spine 1, left) ───────────────────────────── */
.advanced-panel{
  flex:0 0 200px; max-width:200px;
  background:var(--vellum); border-right:1px solid var(--border);
  padding:18px 14px; overflow-y:auto;
  transition:flex-basis var(--t-base), padding var(--t-base);
  display:flex; flex-direction:column; gap:12px;
}
.adv-close{
  background:none; border:none; cursor:pointer; color:var(--ink-3);
  font-size:18px; padding:0; align-self:flex-end;
}
.adv-h{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:18px; margin:0;
}
.adv-section{ margin-bottom:8px; }
.adv-label{
  font-family:var(--sans); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:5px;
}
.adv-pills{ display:flex; flex-wrap:wrap; gap:5px; }
.adv-pill{
  font-family:'Cormorant Garamond', serif; font-style:italic; font-size:12px;
  padding:4px 9px; border:1px solid var(--border); border-radius:14px;
  background:#fff; color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.adv-pill.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.adv-add{
  margin-top:8px; padding:9px;
  font-family:'Cormorant Garamond', serif; font-style:italic; font-size:14px;
  color:#fff; background:var(--oxblood); border:none; border-radius:5px; cursor:pointer;
}

/* ── STAGE ────────────────────────────────────────────────────── */
.stage{
  flex:1; min-width:0;
  padding:30px clamp(20px, 3vw, 40px);
  display:flex; gap:24px; align-items:flex-start;
}

/* ── SOURCE+CURATOR PANEL (spine 2) ───────────────────────────── */
.sc-panel{
  background:#fff; border:1px solid var(--border); border-radius:8px;
  box-shadow:var(--shadow-card);
  display:flex; flex-direction:column; gap:14px;
  padding:18px;
  flex:0 0 400px; max-width:400px;
  transition:flex-basis var(--t-base), max-width var(--t-base), padding var(--t-base);
}
.sc-panel.is-compact{
  flex:0 0 200px; max-width:200px; padding:14px;
}
.sc-source{
  width:100%; aspect-ratio:1; background:#1a1a1a; border-radius:5px; overflow:hidden;
  transition:max-height var(--t-base);
}
.sc-source img{ width:100%; height:100%; object-fit:cover; }
.sc-panel.is-compact .sc-source{
  width:150px; height:150px; max-height:150px; align-self:center;
}
.sc-eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--sage);
}
.sc-title{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:22px; line-height:1.1; color:var(--ink); margin:0;
}
.sc-panel.is-compact .sc-title{ font-size:17px; }
.sc-notes{ list-style:none; padding:0; margin:0; }
.sc-notes li{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:16px; color:var(--ink); line-height:1.4;
  padding:7px 0 7px 12px; position:relative;
  border-bottom:1px dashed rgba(0,0,0,.08);
}
.sc-notes li:last-child{ border-bottom:none; }
.sc-notes li::before{
  content:''; position:absolute; left:0; top:13px;
  width:5px; height:5px; border-radius:50%; background:var(--oxblood);
}
.sc-panel.is-compact .sc-notes li{ font-size:13px; padding:5px 0 5px 10px; }
.sc-panel.is-compact .sc-notes li::before{ top:11px; width:4px; height:4px; }
.sc-leadin{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:17px; color:var(--ink-2); padding-top:6px;
  border-top:1px solid rgba(0,0,0,.08);
}
.sc-panel.is-compact .sc-leadin{ display:none; }

/* ── SUGGESTED PANEL (spine 3) — hero in Phase 1 ──────────────── */
.suggested{
  flex:1 1 auto; min-width:0;
  display:flex; flex-direction:column; gap:18px;
  transition:flex var(--t-base);
}
.suggested-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:14px;
}
.suggested-title{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:28px; line-height:1.1; margin:0;
}
.suggested-grid{
  display:grid; gap:18px;
  grid-template-columns:repeat(3, minmax(0, 350px));
  justify-content:start;
}
.rec-card{
  background:#fff; border:1px solid var(--border); border-radius:6px;
  overflow:hidden; box-shadow:var(--shadow-card);
  display:flex; flex-direction:column;
  cursor:pointer; transition:transform var(--t-fast), box-shadow var(--t-fast), outline-color var(--t-fast);
  outline:2px solid transparent;
  max-width:350px;
}
.rec-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-hero); }
.rec-card.is-queued{ outline-color:var(--sage); }
.rec-img-wrap{
  position:relative; aspect-ratio:1; background:#1a1a1a; overflow:hidden;
}
.rec-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
.rec-quality{
  position:absolute; top:9px; right:9px;
  font-family:var(--mono); font-size:11px;
  background:rgba(255,255,255,.94); padding:3px 8px; border-radius:12px;
  color:var(--ink);
}
.rec-quality.excellent{ color:var(--brass); font-weight:600; }
.rec-quality.good{ color:var(--good); }
.rec-quality.limited{ color:var(--warn); }
.rec-meta{
  padding:10px 14px 12px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.rec-name{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:18px; color:var(--ink);
}
.rec-state{
  font-family:var(--mono); font-size:10px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3);
}
.rec-card.is-queued .rec-state{ color:var(--sage); font-weight:600; }

/* sixth slot — Add All 5 */
.add-all-card{
  background:var(--oxblood); border:none; border-radius:6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; color:#fff; padding:18px;
  box-shadow:var(--shadow-card);
  max-width:350px; aspect-ratio:1 / 1.12;
  transition:background var(--t-fast), transform var(--t-fast);
}
.add-all-card:hover{ background:var(--oxblood-dark); transform:translateY(-2px); }
.add-all-label{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:28px; line-height:1; text-align:center;
}
.add-all-sub{
  margin-top:10px;
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:14px; opacity:.85; text-align:center;
}
.add-all-price{
  font-family:var(--sans); font-size:17px; font-weight:600; margin-top:6px;
}

/* ── QUEUE PANEL (spine 4) — slides in when items added; takes stage on Craft */
.queue-panel{
  background:var(--vellum); border:1px solid var(--border); border-radius:8px;
  padding:18px; flex:0 0 260px; max-width:260px;
  display:flex; flex-direction:column; gap:12px;
  transition:flex-basis var(--t-base), max-width var(--t-base),
             padding var(--t-base), transform var(--t-slow);
}
.queue-panel.is-hero{
  flex:1 1 auto; max-width:none;
  padding:28px;
  transform:translateX(0);
}
.queue-head{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:21px; line-height:1.1; color:var(--ink);
}
.queue-panel.is-hero .queue-head{ font-size:30px; }
.queue-tiles{
  display:grid; grid-template-columns:repeat(2, 1fr); gap:8px;
  transition:grid-template-columns var(--t-base);
}
.queue-panel.is-hero .queue-tiles{
  grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:14px;
}
.queue-tile{
  position:relative; background:#fff; border:1px solid var(--border);
  border-radius:5px; overflow:hidden; aspect-ratio:1;
  transition:transform var(--t-slow), opacity var(--t-slow);
}
.queue-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
.queue-tile.is-completed{ animation:flyToCollection var(--t-slow) ease both; }
@keyframes flyToCollection{
  0%   { transform:scale(1); opacity:1; }
  60%  { transform:scale(.7) translateY(120px); opacity:.5; }
  100% { transform:scale(.4) translateY(260px); opacity:0; }
}
.queue-tile-num{
  position:absolute; top:5px; left:5px;
  font-family:var(--mono); font-size:10px;
  background:rgba(255,255,255,.92); padding:2px 6px; border-radius:3px;
}
.queue-tile-x{
  position:absolute; top:5px; right:5px; width:18px; height:18px;
  border-radius:50%; background:rgba(255,255,255,.92); border:none;
  font-size:11px; line-height:1; cursor:pointer; color:var(--ink-2);
}
.queue-total{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:10px 0 6px;
  border-top:1px solid rgba(0,0,0,.10);
}
.queue-total-label{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:15px; color:var(--ink-2);
}
.queue-total-price{ font-family:var(--sans); font-size:17px; font-weight:600; }
.queue-total-price .was{ text-decoration:line-through; color:var(--ink-3); font-weight:400; margin-right:6px; font-size:13px; }
.queue-total-price .off{ color:var(--good); font-size:12px; margin-left:6px; }
.btn-craft{
  width:100%; padding:12px;
  font-family:'Cormorant Garamond', serif; font-style:italic; font-size:18px;
  color:#fff; background:var(--sage); border:none; border-radius:5px;
  cursor:pointer; transition:background var(--t-fast);
}
.btn-craft:hover{ background:#576648; }
.queue-panel.is-hero .btn-craft{ font-size:21px; padding:15px; }

/* Crafting status during Phase 2 */
.craft-status{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:18px; color:var(--ink-2); padding:10px 0;
  text-align:center;
}

/* ── MY COLLECTION PEEK (only visible during Phase 2 / Phase 3) ─ */
.collection-peek{
  position:fixed; bottom:0; left:0; right:0;
  background:var(--vellum); border-top:1px solid var(--border);
  padding:14px 22px;
  display:none; gap:14px; align-items:center;
  z-index:80;
  transform:translateY(100%);
  transition:transform var(--t-base);
}
.collection-peek.is-visible{
  display:flex; transform:translateY(0);
}
.peek-label{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:18px; color:var(--ink); margin-right:8px;
}
.peek-thumbs{
  display:flex; gap:8px; flex:1; overflow-x:auto;
}
.peek-thumb{
  flex:0 0 64px; height:64px; border:1px solid var(--border); border-radius:4px;
  overflow:hidden; background:#fff;
  animation:peekIn .6s ease both;
}
.peek-thumb img{ width:100%; height:100%; object-fit:cover; }
@keyframes peekIn{
  from{ transform:scale(.5) translateY(-30px); opacity:0; }
  to  { transform:scale(1) translateY(0); opacity:1; }
}
.peek-go{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:15px; padding:8px 16px;
  border:1px solid var(--oxblood); color:var(--oxblood); background:#fff;
  border-radius:18px; cursor:pointer;
}

/* ── MY COLLECTION STAGE (Phase 3) ────────────────────────────── */
.collection-stage{
  flex:1; padding:30px clamp(20px, 3vw, 40px);
  display:flex; flex-direction:column; gap:22px;
}
.collection-title{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:32px; line-height:1.1; margin:0;
}
.collection-current{
  background:#fff; border:1px solid var(--border); border-radius:8px;
  padding:22px; box-shadow:var(--shadow-card);
  min-height:48vh; max-height:60vh;
  display:flex; flex-direction:column; gap:14px;
}
.collection-section-label{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--sage);
}
.collection-section-title{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:24px; line-height:1.1; margin:0;
}
.collection-current-grid{
  flex:1; display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 350px));
  gap:18px; overflow-y:auto;
  justify-content:start;
}
.col-piece{
  background:#fff; border:1px solid var(--border); border-radius:6px;
  overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column;
  transition:transform var(--t-fast), box-shadow var(--t-fast);
}
.col-piece:hover{ transform:translateY(-3px); box-shadow:var(--shadow-hero); }
.col-piece img{ width:100%; aspect-ratio:1; object-fit:cover; }
.col-piece-meta{
  padding:10px 14px;
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:17px; color:var(--ink);
}

/* other series rows */
.collection-others{
  display:flex; flex-direction:column; gap:18px;
}
.col-series{
  background:#fff; border:1px solid var(--border); border-radius:6px;
  padding:14px 18px;
  cursor:pointer;
  transition:transform var(--t-fast), box-shadow var(--t-fast);
}
.col-series:hover{ transform:translateY(-1px); box-shadow:var(--shadow-card); }
.col-series-head{
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;
}
.col-series-name{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:20px;
}
.col-series-count{
  font-family:var(--mono); font-size:11px; color:var(--ink-3);
  letter-spacing:.06em; text-transform:uppercase;
}
.col-series-strip{
  display:flex; gap:8px; overflow-x:auto;
}
.col-series-thumb{
  flex:0 0 88px; height:88px; border-radius:4px; overflow:hidden;
  border:1px solid var(--border); background:#fff;
}
.col-series-thumb img{ width:100%; height:100%; object-fit:cover; }
.col-series-empty{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:14px; color:var(--ink-3); padding:8px 0;
}

/* ── LIGHTBOX ─────────────────────────────────────────────────── */
.lightbox{
  position:fixed; inset:0; background:rgba(42,36,30,.85);
  display:none; align-items:center; justify-content:center;
  z-index:300; padding:40px;
}
.lightbox.is-open{ display:flex; }
.lb-inner{
  background:#fff; border-radius:8px; max-width:900px; width:100%;
  display:flex; flex-direction:column; max-height:90vh; overflow:hidden;
}
.lb-img{ width:100%; max-height:65vh; object-fit:contain; background:#1a1a1a; }
.lb-actions{
  padding:18px 22px; display:flex; gap:10px; align-items:center;
}
.lb-name{
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:22px; margin-right:auto;
}
.lb-btn{
  font-family:'Cormorant Garamond', serif; font-style:italic; font-size:15px;
  padding:8px 16px; border:1px solid var(--border); background:#fff;
  border-radius:18px; cursor:pointer; color:var(--ink);
}
.lb-btn.primary{ background:var(--oxblood); color:#fff; border-color:var(--oxblood); }
.lb-close{
  position:fixed; top:14px; right:18px; background:none; border:none;
  color:#fff; font-size:32px; cursor:pointer;
}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">Liten &amp; Co</span>
  <span class="brand-sub">Crafted Portraits</span>
  <span class="proto-badge">PROTOTYPE · five-spine architecture</span>
  <div class="stage-toggle" id="stageToggle">
    <button data-phase="upload">Upload</button>
    <button data-phase="composing" class="active">Composing</button>
    <button data-phase="crafting">Crafting</button>
    <button data-phase="collection">My Collection</button>
  </div>
</div>

<div class="app" id="app"></div>

<!-- Peek tray — shows pieces flying into My Collection during craft -->
<div class="collection-peek" id="peek">
  <span class="peek-label">My Collection</span>
  <div class="peek-thumbs" id="peekThumbs"></div>
  <button class="peek-go" onclick="setPhase('collection')">Open &rsaquo;</button>
</div>

<!-- Lightbox for collection pieces -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lb-close" onclick="closeLightbox()">×</button>
  <div class="lb-inner" onclick="event.stopPropagation()">
    <img class="lb-img" id="lbImg" src="" alt="">
    <div class="lb-actions">
      <div class="lb-name" id="lbName"></div>
      <button class="lb-btn">Download · 1K (as-is)</button>
      <button class="lb-btn">Download · 2K (+$2)</button>
      <button class="lb-btn">Download · 4K (+$5)</button>
      <button class="lb-btn primary">Send to Print Shop &rsaquo;</button>
    </div>
  </div>
</div>

<script>
// ═══ MOCK DATA ═══════════════════════════════════════════════════
function tile(hex, label){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
    <rect width="600" height="600" fill="${hex}"/>
    <text x="300" y="320" text-anchor="middle" font-family="Cormorant Garamond, serif"
      font-style="italic" font-size="38" fill="rgba(255,255,255,.78)">${label}</text>
  </svg>`
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`
}

const RECS = [
  { id:'walnut',         name:'Walnut',           quality:'excellent', img:tile('#5a3a22','Walnut') },
  { id:'folded_book',    name:'Folded Book',      quality:'excellent', img:tile('#c9bba3','Folded Book') },
  { id:'bronze',         name:'Bronze',           quality:'good',      img:tile('#6f5128','Bronze') },
  { id:'alabaster',      name:'Alabaster',        quality:'good',      img:tile('#e6dccb','Alabaster') },
  { id:'charcoal_chalk', name:'Charcoal & Chalk', quality:'limited',   img:tile('#3a3a3a','Charcoal & Chalk') },
]

// Mock cross-Series archive content
const ARCHIVE = {
  Portraits: [
    { name:'Walnut',      img:tile('#5a3a22','Walnut') },
    { name:'Folded Book', img:tile('#c9bba3','Folded Book') },
    { name:'Bronze',      img:tile('#6f5128','Bronze') },
    { name:'Alabaster',   img:tile('#e6dccb','Alabaster') },
  ],
  Houses:    [{ name:'Spring',  img:tile('#7a8f4a','House · Spring') }, { name:'Fall',  img:tile('#8a5a2a','House · Fall') }],
  Action:    [{ name:'Storm',   img:tile('#3a4a6a','Action · Storm') }],
  Groups:    [],
  Landscapes:[{ name:'Coast',   img:tile('#5a7a8a','Landscape · Coast') }],
  Pets:      [{ name:'Bronze',  img:tile('#4a3322','Pet · Bronze') }],
  'For Fun': [],
  'The Artist Series': [],
}

// ── State ──
const state = {
  phase: 'composing',
  queue: ['walnut', 'folded_book', 'bronze'],     // seeded for realism
  advancedOpen: false,
  isCrafting: false,
  completedThisRun: [],   // animates into peek tray as renders finish
}

document.getElementById('stageToggle').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') setPhase(e.target.dataset.phase)
})

function setPhase(p){
  state.phase = p
  document.querySelectorAll('#stageToggle button').forEach(b => b.classList.toggle('active', b.dataset.phase === p))
  // seed believable state per phase
  if (p === 'upload') { state.queue = []; state.completedThisRun = []; state.isCrafting = false }
  if (p === 'composing') { state.queue = ['walnut','folded_book','bronze']; state.completedThisRun = []; state.isCrafting = false }
  if (p === 'crafting') { state.queue = RECS.map(r => r.id); state.completedThisRun = []; state.isCrafting = true }
  if (p === 'collection') { state.completedThisRun = []; state.isCrafting = false }
  render()
}

function toggleAdv(){ state.advancedOpen = !state.advancedOpen; render() }
function closeAdv(){ state.advancedOpen = false; render() }
function toggleItem(id){
  const i = state.queue.indexOf(id)
  if (i >= 0) state.queue.splice(i, 1)
  else state.queue.push(id)
  render()
}
function addAll(){
  RECS.forEach(r => { if (!state.queue.includes(r.id)) state.queue.push(r.id) })
  render()
}
function startCraft(){
  if (!state.queue.length) return
  state.isCrafting = true
  state.completedThisRun = []
  state.phase = 'crafting'
  document.querySelectorAll('#stageToggle button').forEach(b => b.classList.toggle('active', b.dataset.phase === 'crafting'))
  render()
  // Mock the crafting loop — each item completes on a stagger
  state.queue.forEach((id, idx) => {
    setTimeout(() => {
      completePiece(id)
    }, 1200 + idx * 1100)
  })
}
function completePiece(id){
  state.completedThisRun.push(id)
  // Mark tile for fly animation
  const tileEl = document.querySelector(`.queue-tile[data-id="${id}"]`)
  if (tileEl) tileEl.classList.add('is-completed')
  // After animation, remove from queue and push to peek
  setTimeout(() => {
    state.queue = state.queue.filter(q => q !== id)
    // also push into Portraits archive
    const rec = RECS.find(r => r.id === id)
    if (rec) ARCHIVE.Portraits.unshift({ name:rec.name, img:rec.img })
    render()
  }, 580)
}

function priceForCount(n){
  if (n >= 10) return { per:2.79, label:'30% off' }
  if (n >= 5)  return { per:2.99, label:'25% off' }
  if (n >= 2)  return { per:3.39, label:'15% off' }
  return { per:3.99, label:'' }
}

function openLightbox(name, img){
  document.getElementById('lbImg').src = img
  document.getElementById('lbName').textContent = name
  document.getElementById('lightbox').classList.add('is-open')
}
function closeLightbox(e){
  if (e && e.target.classList && !e.target.classList.contains('lightbox') && e.target.tagName !== 'BUTTON') return
  document.getElementById('lightbox').classList.remove('is-open')
}

// ═══ RENDER ═══════════════════════════════════════════════════════
function render(){
  const app = document.getElementById('app')
  app.innerHTML = ''
  const peek = document.getElementById('peek')
  peek.classList.toggle('is-visible', state.isCrafting && state.completedThisRun.length > 0)
  if (state.isCrafting) renderPeek()

  if (state.phase === 'collection') return renderCollection(app)
  renderWorkshop(app)
}

function renderWorkshop(app){
  // 1. ADVANCED — spine or panel
  if (state.advancedOpen){
    const adv = document.createElement('div')
    adv.className = 'advanced-panel'
    adv.innerHTML = `
      <button class="adv-close" onclick="closeAdv()">×</button>
      <h3 class="adv-h">Style Controls</h3>
      <div class="adv-section">
        <div class="adv-label">Style</div>
        <div class="adv-pills">
          <button class="adv-pill active">Realistic</button>
          <button class="adv-pill">Artists Gallery</button>
        </div>
      </div>
      <div class="adv-section">
        <div class="adv-label">Material</div>
        <div class="adv-pills">
          <button class="adv-pill">Ebony</button>
          <button class="adv-pill">Walnut</button>
          <button class="adv-pill">Stone</button>
          <button class="adv-pill">Bronze</button>
          <button class="adv-pill">Iron</button>
          <button class="adv-pill">Alabaster</button>
        </div>
      </div>
      <div class="adv-section">
        <div class="adv-label">Framing</div>
        <div class="adv-pills">
          <button class="adv-pill">Bust</button>
          <button class="adv-pill active">Signature</button>
          <button class="adv-pill">Statuesque</button>
        </div>
      </div>
      <div class="adv-section">
        <div class="adv-label">Quality</div>
        <div class="adv-pills">
          <button class="adv-pill active">Web</button>
          <button class="adv-pill">Print +$2</button>
          <button class="adv-pill">Collector +$5</button>
        </div>
      </div>
      <button class="adv-add" onclick="toggleItem('walnut')">+ Add to queue</button>
    `
    app.appendChild(adv)
  } else {
    const spine = document.createElement('div')
    spine.className = 'spine'
    spine.onclick = toggleAdv
    spine.innerHTML = `<span class="spine-label">Advanced ›</span>`
    app.appendChild(spine)
  }

  // STAGE container
  const stage = document.createElement('div')
  stage.className = 'stage'

  // PHASE: upload (no suggestions yet) — Source+Curator full-size, no queue
  if (state.phase === 'upload') {
    stage.appendChild(buildSourceCurator(false))
  }

  // PHASE: composing — Source+Curator compact, Suggested 60%, Queue if any
  if (state.phase === 'composing') {
    stage.appendChild(buildSourceCurator(true))
    stage.appendChild(buildSuggested())
    if (state.queue.length > 0) stage.appendChild(buildQueue(false))
  }

  // PHASE: crafting — Source+Curator spine, Suggested spine, Queue takes stage
  if (state.phase === 'crafting') {
    // Curator spine
    const cSpine = document.createElement('div')
    cSpine.className = 'spine'
    cSpine.innerHTML = `<span class="spine-label">The Curator ›</span>`
    stage.appendChild(cSpine)
    // Suggested spine
    const sSpine = document.createElement('div')
    sSpine.className = 'spine'
    sSpine.innerHTML = `<span class="spine-label">Suggested ›</span>`
    stage.appendChild(sSpine)
    // Queue as hero
    stage.appendChild(buildQueue(true))
  }

  app.appendChild(stage)
}

function buildSourceCurator(compact){
  const el = document.createElement('div')
  el.className = 'sc-panel' + (compact ? ' is-compact' : '')
  el.innerHTML = `
    <div class="sc-source">
      <img src="${tile('#5a4a3a','Your photograph')}" alt="Source">
    </div>
    <div>
      <div class="sc-eyebrow">The Curator</div>
      <h3 class="sc-title">${compact ? 'About your photograph' : 'About your photograph'}</h3>
    </div>
    <ul class="sc-notes">
      <li>The face is sharp and well-lit &mdash; an excellent source.</li>
      <li>A three-quarter angle would give the strongest piece, but this front view will work beautifully.</li>
      <li>No need for additional photos &mdash; the studio has what it needs.</li>
    </ul>
    <div class="sc-leadin">Here are the five styles I would reach for first &rarr;</div>
  `
  return el
}

function buildSuggested(){
  const el = document.createElement('div')
  el.className = 'suggested'
  el.innerHTML = `
    <div class="suggested-head">
      <h2 class="suggested-title">Five styles we'd choose for you</h2>
    </div>
    <div class="suggested-grid">
      ${RECS.map(r => {
        const isQ = state.queue.includes(r.id)
        return `
          <div class="rec-card ${isQ?'is-queued':''}" onclick="toggleItem('${r.id}')">
            <div class="rec-img-wrap">
              <img src="${r.img}" alt="${r.name}">
              <div class="rec-quality ${r.quality}">${r.quality.charAt(0).toUpperCase()+r.quality.slice(1)}</div>
            </div>
            <div class="rec-meta">
              <div class="rec-name">${r.name}</div>
              <div class="rec-state">${isQ ? '✓ In Queue' : '+ Add'}</div>
            </div>
          </div>`
      }).join('')}
      <div class="add-all-card" onclick="addAll()">
        <div class="add-all-label">Add All 5</div>
        <div class="add-all-sub">five for the price of four</div>
        <div class="add-all-price">$14.95</div>
      </div>
    </div>
  `
  return el
}

function buildQueue(asHero){
  const n = state.queue.length
  const tier = priceForCount(n)
  const total = (n * tier.per).toFixed(2)
  const was = (n * 3.99).toFixed(2)

  const el = document.createElement('aside')
  el.className = 'queue-panel' + (asHero ? ' is-hero' : '')
  el.innerHTML = `
    <div class="queue-head">${asHero ? 'Crafting your collection' : 'Ready to Craft'}</div>
    ${asHero && state.isCrafting ? `<div class="craft-status">${n > 0 ? `${n} ${n===1?'piece':'pieces'} remaining…` : 'Complete &mdash; your pieces are in My Collection.'}</div>` : ''}
    <div class="queue-tiles">
      ${state.queue.map((id, i) => {
        const r = RECS.find(x => x.id === id)
        if (!r) return ''
        return `
          <div class="queue-tile" data-id="${id}">
            <img src="${r.img}" alt="${r.name}">
            <div class="queue-tile-num">${String(i+1).padStart(2,'0')}</div>
            ${!state.isCrafting ? `<button class="queue-tile-x" onclick="event.stopPropagation();toggleItem('${id}')">×</button>` : ''}
          </div>`
      }).join('')}
    </div>
    ${!state.isCrafting ? `
      <div class="queue-total">
        <span class="queue-total-label">${n} ${n===1?'piece':'pieces'}</span>
        <span class="queue-total-price">
          ${n>1?`<span class="was">$${was}</span>`:''}$${total}
          ${tier.label?`<span class="off">${tier.label}</span>`:''}
        </span>
      </div>
      <button class="btn-craft" ${n===0?'disabled':''} onclick="startCraft()">Craft all ${n||''} &rsaquo;</button>
    ` : ''}
  `
  return el
}

function renderPeek(){
  const thumbs = document.getElementById('peekThumbs')
  thumbs.innerHTML = state.completedThisRun.map(id => {
    const r = RECS.find(x => x.id === id)
    return r ? `<div class="peek-thumb"><img src="${r.img}" alt="${r.name}"></div>` : ''
  }).join('')
}

// ═══ COLLECTION PHASE ═══════════════════════════════════════════
let currentSeries = 'Portraits'
function setCurrentSeries(s){ currentSeries = s; render() }

function renderCollection(app){
  document.getElementById('peek').classList.remove('is-visible')

  const wrap = document.createElement('div')
  wrap.className = 'collection-stage'

  // Current series — top, takes ~half vertical
  const current = ARCHIVE[currentSeries] || []
  const currentEl = document.createElement('div')
  currentEl.className = 'collection-current'
  currentEl.innerHTML = `
    <div>
      <div class="collection-section-label">Current series</div>
      <h2 class="collection-section-title">${currentSeries}</h2>
    </div>
    <div class="collection-current-grid">
      ${current.length === 0
        ? `<div class="col-series-empty">No ${currentSeries} pieces yet.</div>`
        : current.map(p => `
          <div class="col-piece" onclick="openLightbox('${p.name}','${p.img.replace(/'/g, "\\'")}')">
            <img src="${p.img}" alt="${p.name}">
            <div class="col-piece-meta">${p.name}</div>
          </div>
        `).join('')
      }
    </div>
  `
  wrap.appendChild(currentEl)

  // Other series — strip each
  const others = document.createElement('div')
  others.className = 'collection-others'
  Object.keys(ARCHIVE).filter(s => s !== currentSeries).forEach(s => {
    const pieces = ARCHIVE[s]
    const seriesEl = document.createElement('div')
    seriesEl.className = 'col-series'
    seriesEl.onclick = () => setCurrentSeries(s)
    seriesEl.innerHTML = `
      <div class="col-series-head">
        <div class="col-series-name">${s}</div>
        <div class="col-series-count">${pieces.length} ${pieces.length===1?'piece':'pieces'}</div>
      </div>
      ${pieces.length === 0
        ? `<div class="col-series-empty">No ${s} pieces yet.</div>`
        : `<div class="col-series-strip">
            ${pieces.map(p => `<div class="col-series-thumb"><img src="${p.img}" alt="${p.name}"></div>`).join('')}
          </div>`}
    `
    others.appendChild(seriesEl)
  })
  wrap.appendChild(others)

  app.appendChild(wrap)
}

// Boot
render()
</script>

</body>
</html>
