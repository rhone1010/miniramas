     finishes is restated in this file: a finish added to
     effect-registry.ts appears here after the emit, with no edit. -->

<script src="/concierge.js" defer></script>

<style>
/* ==========================================================================
   THE GALLERY · 2026-08-08
   A showroom, not the workshop. Every finish at size, on both sitters.

   THE SHAPE IS THE ARGUMENT. Men and women run in two columns side by
   side rather than behind a toggle, so nobody has to press anything to
   find out whether a finish was made for them. Four tiles across the
   page, two to a side.
   ====================================================================== */

:root{
  /* Same ramp as the workshop. The floor is the point — a clamp whose
     minimum is 16px cannot reproduce the undersized type fault. */
  font-size:clamp(16px, 0.5vw + 6.4px, 22px);

  --ink:#2a241e;  --ink-soft:#5a5248;  --taupe:#aba39a;
  --vellum:#f3ede1; --vellum-100:#f8f4eb; --vellum-200:#f3ecdd; --vellum-300:#e9dec8;
  --limestone:#f1ece3;
  --oxblood:#7d4242; --brass:#75623a; --gold:#b68a53;
  --espresso:#26201a; --coffee-700:#332620;
  --series:#d7bd89;   /* the switcher's colour; this page never had it */

  --mh-h:90px;    /* masthead height — the workshop's number */
  --mark-h:60px;  /* the L mark, measured by height; width follows */
  --card-line:rgba(196,169,110,.28);
  --hairline:rgba(123,92,58,.20);

  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Manrope',sans-serif;
  --r-card:8px;

  /* 5% a side. */
  --stage-gutter:5%;

  /* THE PLATES ARE 400px WIDE. A tile drawn wider than its source is a
     blurry tile, so the ceiling is 430 — 400 plus a little, which reads
     sharp. Two of those plus the gap is 886, and beyond that a wide
     screen gets more margin rather than a bigger blur. */
  --tile-max:430px;
  --tiles-max:calc((var(--tile-max) * 2) + var(--tile-gap));
  --stage-w:calc(100% - (var(--stage-gutter) * 2));

  --tile-gap:clamp(14px, 1.1vw, 26px);
  --column-gap:clamp(28px, 3vw, 72px);
}

*{margin:0; padding:0; box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit; border:none; background:none; color:inherit}
img{display:block; max-width:100%}

html{ scroll-behavior:smooth; scroll-padding-top:145px }
body{
  min-height:100%;
  background:var(--limestone);
  color:var(--ink);
  font-family:var(--sans);
  font-size:1rem;
  /* clip, NOT hidden. overflow-x:hidden on the body makes it a scroll
     container in Chrome and silently kills every position:sticky. */
  overflow-x:clip;
}
.stage{ width:var(--stage-w); margin:0 auto }
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- MASTHEAD · the workshop's geometry, verbatim -------------------- */
.mh{
  position:sticky; top:0; z-index:60;
  height:var(--mh-h);
  background:var(--espresso);
  display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  padding-inline:var(--stage-gutter);
}
.mh-logo{ justify-self:start; display:block }
.mh-logo{
  justify-self:start; text-decoration:none;
  display:inline-flex; align-items:center;
  color:var(--vellum-100);          /* the mark inherits this */
}
.mh-mark{
  height:var(--mark-h); width:auto; flex:0 0 auto;
  display:block; overflow:visible;
}
.mh-mark path{ fill:currentColor }
/* ---- the series switcher --------------------------------------------
   Ported verbatim from the Studio. Not a fourth zone - it lives inside
   the nav so the three-zone rule holds. It names the room you are
   standing in and opens the door to the others. */
.mh-series{ position:relative; display:flex; align-items:center; margin-right:34px }
.mh-series-btn{
  display:inline-flex; align-items:center; gap:.34em;
  font-family:var(--serif); font-size:1.8em; font-weight:400; line-height:1;
  color:var(--series); padding:10px 0; cursor:pointer; white-space:nowrap;
  background:none; border:none;
  transition:color .16s ease;
}
.mh-series-btn:hover{ color:#e6d2a8 }
/* The label collapses the way Community's does, at the same width and
   by the same mechanism. Gallery had no breakpoint above 900px, so the
   query is new here rather than a rule added to an existing one. */
@media (max-width:1320px){
  #mhSeriesLabel .mh-crafted{ display:none }
}
.mh-series-btn .caret{
  width:.52em; height:.52em; flex:0 0 auto; margin-top:.14em; opacity:.72;
  transform-origin:50% 45%;
  transition:transform .22s cubic-bezier(.22,.7,.3,1), opacity .16s ease;
}
.mh-series-btn .caret path{
  fill:none; stroke:currentColor; stroke-width:1.35;
  stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke;
}
.mh-series-btn:hover .caret{ opacity:1 }
.mh-series-btn[aria-expanded="true"] .caret{ transform:rotate(180deg); opacity:1 }

.mh-series-menu{
  position:absolute; top:calc(100% + 12px); left:50%; transform:translateX(-50%);
  min-width:16em;
  background:linear-gradient(180deg,#2a1f1b 0%, #221915 100%);
  border:1px solid var(--card-line);
  border-radius:var(--r-card);
  box-shadow:0 22px 48px -20px rgba(20,12,8,.7), inset 0 1px 0 rgba(255,255,255,.06);
  padding:20px; display:flex; flex-direction:column; z-index:70;
}
.mh-series-menu a{
  display:flex; align-items:center; justify-content:space-between; gap:1.2em;
  font-family:var(--serif); font-size:1.45em; font-weight:400; line-height:1.1;
  color:var(--vellum-200); text-decoration:none; white-space:nowrap;
  padding:.52em .7em; border-radius:6px;
  transition:background .14s ease, color .14s ease;
}
.mh-series-menu a:hover,.mh-series-menu a:focus-visible{
  background:linear-gradient(180deg, rgba(215,189,137,.16), rgba(215,189,137,.09));
  color:var(--series); outline:none;
}
.mh-series-menu a[aria-current="page"]{ color:var(--series) }
.mh-series-menu a[aria-current="page"]::after{
  content:""; width:5px; height:5px; border-radius:50%; background:var(--series);
}
/* SECOND LEVEL. The rooms inside Mobile Wallpapers. Indented and a size
   down rather than a flyout: a hover submenu cannot be opened by a thumb,
   and this menu is already a click-toggle. The rule sits on the anchor so
   the existing hover, focus and aria-current rules above still apply. */
.mh-series-menu a.sub{
  font-size:1.15em; padding-left:1.9em; color:var(--vellum-300, var(--vellum-200));
}
.mh-series-menu a.sub::before{
  content:""; position:absolute; left:1.05em;
  width:1px; height:1.05em;
  background:linear-gradient(180deg, transparent, rgba(215,189,137,.42));
}
.mh-series-menu a.sub{ position:relative }

.mh-series-menu .sep{
  height:1px; margin:6px 8px;
  background:linear-gradient(90deg, transparent, rgba(215,189,137,.28), transparent);
}

.mh-nav{ justify-self:center; display:flex; align-items:center; gap:32px }
.mh-nav a{
  position:relative; text-decoration:none; white-space:nowrap;
  font-family:var(--serif); font-size:1.5em; font-weight:400; line-height:1;
  color:var(--vellum-300); padding:10px 0;
  transition:color .16s ease;
}
.mh-nav a:hover{ color:var(--vellum-100) }
.mh-nav a.on,.mh-nav a[aria-current="page"]{ color:var(--gold) }
.mh-nav a.on::after{
  content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px;
  background:var(--gold);
}
.mh-right{ justify-self:end; display:flex; align-items:center; gap:12px }
.mh-cta{
  font-family:var(--serif); font-style:italic; font-size:1.25rem;
  background:var(--oxblood); color:var(--vellum-100);
  padding:.5rem 1.4rem; border-radius:999px; text-decoration:none;
  white-space:nowrap;
}
.mh-cta:hover{ background:#8d4b4b; color:#fff }

/* ---- THE HEAD --------------------------------------------------------
   A TITLE, NOT A FOLD. Ruled 2026-08-09: nothing above the first tile may
   take more than about 150px. This is a gallery — the argument is the
   volume of work, and a paragraph explaining that in front of it is the
   wrong thing to spend the first screen on. Centred, two lines, done. */
.open{ padding:34px 0 26px; text-align:center }
.open h1{
  font-family:var(--serif); font-weight:400; font-style:italic;
  font-size:clamp(2rem,2.9vw,2.75rem); line-height:1.06; color:var(--ink);
}
.open p{
  font-family:var(--sans); font-weight:300;
  font-size:1.0625rem; letter-spacing:.01em;
  color:var(--ink-soft); margin-top:.35rem;
}

/* ---- SILO JUMP ------------------------------------------------------- */
/* THE FILTERS FLOAT. Still sticky under the masthead, but the espresso
   fill and the hairline are gone - those were what made a separate bar
   read as the bottom of the masthead. The pills keep their own dark
   fill, so they stay legible while the vellum runs beneath them. */
.jump{
  position:sticky; top:var(--mh-h); z-index:50;
  background:transparent;
  border-bottom:none;
  pointer-events:none;   /* the bar is air; only the pills take clicks */
}
.jump-in{ pointer-events:auto }
.jump-in{
  width:var(--stage-w); margin:0 auto;
  display:flex; justify-content:center; gap:8px; overflow-x:auto;
  padding:10px 0; scrollbar-width:none;
}
.jump-in::-webkit-scrollbar{ display:none }
/* 1.5rem. At .9375 these read as captions; they are the only way to move
   around this page and should look like it. Padding opened to match, and
   a shadow so a pill sitting over a photograph still has an edge. */
.jump a, .jump button{
  font-family:var(--serif); font-style:italic; font-size:1.5rem;
  text-decoration:none; white-space:nowrap; line-height:1;
  padding:.5rem 1.15rem; border-radius:999px;
  box-shadow:0 .3rem .8rem rgba(25,16,10,.18);
  background:var(--coffee-700); color:var(--vellum-200);
  border:1px solid rgba(233,222,200,.14);
  transition:background .16s ease, color .16s ease, border-color .16s ease;
}
.jump a:hover, .jump button:hover{
  background:#453429; color:var(--vellum-100); border-color:rgba(233,222,200,.3);
}
.jump a.on, .jump button.on{
  background:var(--gold); color:var(--espresso); border-color:var(--gold);
}

/* ---- A SILO ---------------------------------------------------------- */
.silo{ padding:clamp(38px,3.6vw,64px) 0; border-bottom:1px solid var(--hairline) }
.silo:last-of-type{ border-bottom:none }

.silo-head{ margin-bottom:clamp(18px,1.8vw,30px) }
.silo-head h2{
  font-family:var(--serif); font-weight:400; font-style:italic;
  font-size:clamp(1.75rem,2.4vw,2.375rem); line-height:1.1; color:var(--ink);
}
.silo-head p{
  font-family:var(--serif); font-size:1.25rem; line-height:1.4;
  color:var(--ink-soft); margin-top:.3rem; max-width:52ch;
}

/* The two sitters, side by side. */
.subjects{ display:grid; grid-template-columns:1fr 1fr; gap:var(--column-gap) }
.subject-head{
  font-family:var(--sans); font-size:.8125rem; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--brass);
  padding-bottom:.75rem; margin-bottom:1.25rem;
  border-bottom:1px solid var(--hairline);
}
.tiles{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--tile-gap); max-width:var(--tiles-max);
}

/* ---- A TILE ---------------------------------------------------------- */
.tile{
  display:block; text-decoration:none; color:inherit;
  background:var(--vellum-100);
  border:1px solid var(--card-line); border-radius:var(--r-card);
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
  transition:transform .18s ease, box-shadow .18s ease;
}
.tile:hover{ transform:translateY(-3px); box-shadow:0 14px 34px rgba(0,0,0,.14) }
.tile-img{ aspect-ratio:4/5; background:var(--vellum-300); position:relative }
.tile-img img{ width:100%; height:100%; object-fit:cover }
/* A finish with no plate for this sitter says so. It does not borrow the
   other sitter's photograph — that is how a woman ended up on a man's
   card before, and it reads as a mistake rather than an absence. */
.tile-img.is-empty::after{
  content:'Not yet photographed';
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--serif); font-style:italic; font-size:1.125rem;
  color:var(--taupe); text-align:center; padding:1rem;
}
/* One line, the finish's name, and nothing under it. "Craft this finish"
   came off 2026-08-09: it promised to open that finish and delivered a
   generic workshop, because ?effect= is not read at the other end. A link
   that lies is worse than no link. It comes back when the workshop opens
   the silo and the Curator is waiting.

   Garamond is NOT used at caption size. It sets about a third smaller
   than a sans at the same px, so small serif reads as an accident. */
.tile-cap{ padding:.75rem 1rem .9rem }
.tile-cap b{
  display:block; font-family:var(--serif); font-weight:400;
  font-size:1.4375rem; line-height:1.2; color:var(--ink);
}

/* ---- CLOSING --------------------------------------------------------- */
.close{ padding:clamp(64px,7vw,120px) 0; text-align:center }
.close h2{
  font-family:var(--serif); font-weight:300; font-style:italic;
  font-size:clamp(2rem,3.6vw,3.2rem); color:var(--ink);
}
.close p{
  font-family:var(--serif); font-size:1.4375rem; color:var(--ink-soft);
  margin:.75rem auto 2rem; max-width:44ch;
}
.close a{
  display:inline-block;
  font-family:var(--serif); font-style:italic; font-size:1.5rem;
  background:var(--oxblood); color:var(--vellum-100);
  padding:.7rem 2.2rem; border-radius:999px; text-decoration:none;
}
.close a:hover{ background:#8d4b4b; color:#fff }

.notice{
  font-family:var(--serif); font-size:1.375rem; line-height:1.5;
  color:var(--ink-soft); padding:4rem 0;
}
.notice code{ font-family:var(--sans); font-size:.9em; color:var(--oxblood) }

/* ---- NARROW ---------------------------------------------------------
   The two sitter columns stack rather than shrink. Two columns of one
   tile each on a phone is not a gallery, it is a list with a gap down
   the middle. Stacked, each sitter still gets two across. */
@media (max-width:900px){
  :root{ --stage-gutter:4% }
  .subjects{ grid-template-columns:1fr; gap:clamp(32px,6vw,48px) }
}
@media (max-width:767px){
  :root{ --stage-gutter:20px }
  .tiles{ max-width:none }
  html{ scroll-padding-top:110px }
  :root{ --mh-h:60px; --mark-h:46px }
  .mh{ grid-template-columns:auto 1fr auto; gap:12px }

  .mh-nav{ display:none }
  .mh-cta{ font-size:1.0625rem; padding:.45rem 1.1rem }

  .jump-in{ justify-content:flex-start }
  .open{ padding:24px 0 18px }
  .tile-cap{ padding:.7rem .8rem .85rem }
  .tile-cap b{ font-size:1.1875rem }
  .tile-cap span{ font-size:1rem }
}
</style>
</head>

<script>
(function(){
  'use strict';

  var gallery = document.getElementById('gallery');
  var jump    = document.getElementById('jump');

  function notice(msg){
    var p = document.createElement('p');
    p.className = 'notice';
    p.innerHTML = msg;
    gallery.innerHTML = '';
    gallery.appendChild(p);
  }

  /* ── THE CATALOGUE ──────────────────────────────────────────────────
     window.EFFECT_REGISTRY is emitted by scripts/emit-effect-registry.js
     from effect-registry.ts. Lowercase keys — silos, effects, poses. */
  var R = window.EFFECT_REGISTRY;
  if (!R || !R.silos || !R.effects || !R.effects.length){
    notice('The catalogue did not load. <code>/effect-registry.js</code> is ' +
           'missing or empty — run <code>node scripts/emit-effect-registry.js</code>.');
    return;
  }

  /* ── THE PLATES ─────────────────────────────────────────────────────
     Fetched rather than inlined. portraits.html inlines its copy because
     the first paint of a room must not wait on a request; this page is a
     scroll, and one request at the top costs nothing worth having. */
  fetch('/previews/effects-manifest.json', { cache:'no-cache' })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(draw)
    .catch(function(){
      notice('The photographs did not load. ' +
             '<code>/previews/effects-manifest.json</code> is missing — run ' +
             '<code>node scripts/emit-preview-manifest.js</code>.');
    });

  function draw(M){
    var base = M.base || '/previews/effects/';
    var art  = M.effects || {};

    /* Whole filenames come out of the manifest, because the extension
       varies by tree and by sitter. Nothing here builds a path from an id
       and hopes. Where a sitter's plate is unshot, the neutral serves; if
       there is no neutral either, the tile says so rather than showing
       the other sitter. */
    function plate(id, which){
      var a = art[id];
      if (!a) return null;
      var name = a[which] || a.neutral || null;
      return name ? base + id + '/' + name : null;
    }

    /* THE GALLERY ASKS FOR THE BIG PLATE FIRST. Built 2026-08-09 by
       scripts/build-gallery-plates.py at 900px, because a tile drawn 430
       CSS pixels wide is 860 real ones on the 2x displays most people
       are using, and the 390s were softening.

       Not in the manifest on purpose: the manifest is written by the
       preview build and knows about man.jpg and woman.jpg. Rather than
       teach two build scripts about each other, the tile asks for @2x
       and falls back to the manifest plate if it is not there — which is
       also what happens for the four effects whose source was too small
       to build. */
    function bigPlate(id, which){
      var a = art[id];
      if (!a || !a[which]) return null;      /* no plate for this sitter */
      return base + id + '/' + which + '@2x.jpg';
    }

    /* The `_woman` ids are CRAFT routes, not finishes — Another Age
       carries seven so a woman's craft reaches a woman's body. They have
       no plates of their own and printing them would draw that room
       twice. One tile per finish. */
    function isVariant(id){
      return R.isVariant ? R.isVariant(id) : /_woman$/.test(id);
    }

    var offerable = R.effects.filter(function(e){
      return e.body === 'live' && !isVariant(e.id);
    });

    function tile(e, which){
      var small = plate(e.id, which);
      var big   = bigPlate(e.id, which);

      var a = document.createElement('a');
      a.className = 'tile';
      a.href = '/portraits?effect=' + encodeURIComponent(e.id);

      var box = document.createElement('div');
      box.className = 'tile-img';

      if (big || small){
        var img = document.createElement('img');
        img.alt = e.label + ', crafted';
        img.loading  = 'lazy';
        img.decoding = 'async';
        /* One retry, then the empty state. The first miss falls back to
           the 390; a second miss means there is genuinely nothing on disk
           and the tile says so rather than leaving a grey hole with no
           explanation. */
        var tried = false;
        img.addEventListener('error', function(){
          if (!tried && small && img.getAttribute('src') !== small){
            tried = true;
            img.src = small;
            return;
          }
          img.remove();
          box.classList.add('is-empty');
        });
        img.src = big || small;
        box.appendChild(img);
      } else {
        box.classList.add('is-empty');
      }

      var cap = document.createElement('div');
      cap.className = 'tile-cap';
      /* Labels go in through textContent, never innerHTML — the registry
         emits plain unicode, so "Charcoal & Chalk" would become &amp;amp;
         on a second pass. */
      var nm = document.createElement('b');
      nm.textContent = e.label;
      cap.appendChild(nm);

      a.appendChild(box);
      a.appendChild(cap);
      return a;
    }

    function column(list, which, heading){
      var col  = document.createElement('div');
      var h    = document.createElement('div');
      h.className = 'subject-head';
      h.textContent = heading;
      var grid = document.createElement('div');
      grid.className = 'tiles';
      list.forEach(function(e){ grid.appendChild(tile(e, which)); });
      col.appendChild(h);
      col.appendChild(grid);
      return col;
    }

    gallery.innerHTML = '';
    jump.innerHTML    = '';

    R.silos.forEach(function(silo){
      var list = offerable.filter(function(e){ return e.category === silo.id; });
      if (!list.length) return;

      var sec = document.createElement('section');
      sec.className = 'silo';
      sec.id = 'silo-' + silo.id;

      var head = document.createElement('div');
      head.className = 'silo-head';
      head.innerHTML = '<h2></h2><p></p>';
      head.querySelector('h2').textContent = silo.label;
      /* The Curator's line, with its "Here are the ... finishes." opener
         trimmed. She is speaking to someone standing in the room, and
         this page is not the room. */
      head.querySelector('p').textContent =
        String(silo.line || '').replace(/^Here are (the )?[^.]*finishes\.\s*/i, '');
      sec.appendChild(head);

      var subjects = document.createElement('div');
      subjects.className = 'subjects';
      subjects.appendChild(column(list, 'man',   'Men'));
      subjects.appendChild(column(list, 'woman', 'Women'));
      sec.appendChild(subjects);

      gallery.appendChild(sec);

      var a = document.createElement('a');
      a.href = '#silo-' + silo.id;
      a.textContent = silo.label;
      jump.appendChild(a);
    });

    /* Which room is current — the one whose top has passed the sticky
       apparatus above it. Marked on the pill, which inverts. */
    var pills = Array.prototype.slice.call(jump.querySelectorAll('a'));
    function mark(){
      var cur = pills[0];
      pills.forEach(function(p){
        var el = document.querySelector(p.getAttribute('href'));
        if (el && el.getBoundingClientRect().top <= 170) cur = p;
      });
      pills.forEach(function(p){ p.classList.toggle('on', p === cur); });
    }
    addEventListener('scroll', mark, { passive:true });
    mark();

    if (!gallery.children.length){
      notice('The catalogue loaded, but no finish is marked <code>live</code>.');
    }
  }
})();
</script>
<script>
/* The Series switcher. Same three behaviours as every other page:
   click toggles, a click anywhere else shuts it, Escape shuts it. */
(function(){
  var b = document.getElementById('mhSeriesBtn');
  var m = document.getElementById('mhSeriesMenu');
  if (!b || !m) return;
  function shut(){ m.hidden = true; b.setAttribute('aria-expanded','false'); }
  b.addEventListener('click', function(e){
    e.stopPropagation();
    var open = m.hidden;
    m.hidden = !open;
    b.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', function(e){
    if (!m.hidden && !m.contains(e.target)) shut();
  });
  addEventListener('keydown', function(e){ if (e.key === 'Escape') shut(); });
})();
</script>
</body>
</html>
