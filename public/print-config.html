<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Configuration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --warm-paper:  #F0EAE0;
  --taupe:       #987946;
  --oxblood:     #763F41;
  --champagne:   #CDC2BB;
  --walnut:      #3D3128;
  --brass:       #E9DFCA;
  --serif:       'Cormorant Garamond', Garamond, Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

body {
  background: #ddd6ca;
  font-family: var(--serif);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}

/* ── MODULE SHELL ── */
.print-module {
  position: relative;
  width: 1060px;
  background: var(--warm-paper);
  border: 1px solid var(--taupe);
  border-radius: 3px;
  padding: 0 0 32px;
}

/* ── TITLE ── */
.print-title {
  text-align: center;
  padding: 20px 0 16px;
  font-style: italic;
  font-size: 36px;
  color: var(--oxblood);
  letter-spacing: -0.01em;
}

/* ── BODY: preview + config side by side ── */
.print-body {
  display: flex;
  gap: 24px;
  padding: 0 32px;
  align-items: flex-start;
}

/* ── PREVIEW ── */
.print-preview {
  flex: 0 0 446px;
  height: 445px;
  background: var(--walnut);
  border: 1px solid var(--warm-paper);
  box-shadow: 0 4px 4px rgba(0,0,0,.25);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.print-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.print-preview .placeholder-text {
  font-style: italic;
  font-size: 18px;
  color: var(--champagne);
  opacity: .4;
}

/* ── CONFIG PANEL (labels left, options right) ── */
.print-config {
  flex: 1;
  display: grid;
  grid-template-columns: auto 1fr;
  min-height: 445px;
}

/* Labels column */
.config-labels {
  background: var(--warm-paper);
  border: 3px solid var(--champagne);
  border-right: none;
  border-radius: 5px 0 0 5px;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
}

/* Options column */
.config-options {
  background: var(--brass);
  border: 3px solid var(--champagne);
  border-left: none;
  border-radius: 0 5px 5px 0;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
}

/* ── CONFIG ROWS — matched pairs ── */
.config-section {
  flex: 1;
  display: flex;
  align-items: center;
}
.config-labels .config-section {
  justify-content: flex-end;
  padding-right: 4px;
}
.config-options .config-section {
  justify-content: flex-start;
}

/* Separator between sections */
.config-labels .config-section + .config-section,
.config-options .config-section + .config-section {
  border-top: 1px solid rgba(0,0,0,.04);
}

.row-label {
  font-style: italic;
  font-size: 24px;
  color: var(--walnut);
  text-align: right;
  line-height: 1;
  white-space: nowrap;
}

/* ── PRESET GRID ── */
.preset-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

/* ── PRESET BUTTON (wrap-type compound label) ── */
.preset-btn {
  padding: 5px 10px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  cursor: pointer;
  font-family: var(--serif);
  font-style: italic;
  font-size: 24px;
  color: var(--walnut);
  opacity: .72;
  transition: all .15s;
  line-height: 1.2;
  white-space: nowrap;
}
.preset-btn:hover {
  opacity: .9;
}
.preset-btn.active {
  border-color: var(--oxblood);
  opacity: 1;
}

/* Compound labels: "Paper . Fine Art" */
.preset-btn .pb-cat {
  color: var(--walnut);
}
.preset-btn .pb-dot {
  color: var(--walnut);
  margin: 0 4px;
}
.preset-btn .pb-style {
  color: var(--oxblood);
}
.preset-btn.active .pb-cat { color: var(--walnut) }
.preset-btn.active .pb-style { color: var(--oxblood); font-weight: 500 }

/* Wrap type: single column */
.preset-grid.wrap-grid {
  flex-direction: column;
  gap: 2px;
}

/* Size: 3 per row */
.preset-grid.size-grid {
  gap: 4px;
}
.preset-grid.size-grid .preset-btn {
  font-size: 22px;
}

/* Frame: inline row */
.preset-grid.frame-grid {
  gap: 6px;
}
.preset-grid.frame-grid .preset-btn {
  font-size: 22px;
}

/* ── QUANTITY SELECTOR ── */
.qty-wrap {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--oxblood);
  border-radius: 5px;
  padding: 3px 6px;
  gap: 8px;
}
.qty-btn {
  background: none;
  border: none;
  font-family: var(--serif);
  font-size: 18px;
  color: var(--oxblood);
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
  transition: opacity .15s;
}
.qty-btn:hover { opacity: .6 }
.qty-btn:disabled { opacity: .3; cursor: not-allowed }
.qty-num {
  font-style: italic;
  font-size: 22px;
  color: var(--oxblood);
  min-width: 18px;
  text-align: center;
}

/* ── ORDER TRAY ── */
.order-tray {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 28px 0 0;
}
.order-total {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-style: italic;
  color: var(--oxblood);
}
.order-total .total-label {
  font-size: 36px;
}
.order-total .total-pretax {
  font-size: 20px;
  opacity: .7;
}
.order-total .total-amount {
  font-size: 36px;
}

.add-to-order {
  background: var(--oxblood);
  color: var(--warm-paper);
  border: none;
  border-radius: 3px;
  padding: 10px 52px 12px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 30px;
  cursor: pointer;
  transition: background .15s;
  letter-spacing: .01em;
}
.add-to-order:hover { background: #5e3234 }
.add-to-order:disabled { opacity: .5; cursor: not-allowed }

/* ── MATERIAL TOOLTIP ── */
.material-tooltip {
  position: absolute;
  right: -250px;
  top: 96px;
  width: 240px;
  background: var(--warm-paper);
  border: 2px solid var(--champagne);
  opacity: .75;
  padding: 14px 18px;
  font-style: italic;
  font-size: 22px;
  color: #000;
  line-height: 1.35;
  display: none;
}
.material-tooltip.visible { display: block }

/* ── RESPONSIVE ── */
@media (max-width: 1400px) {
  .material-tooltip { display: none !important }
}
@media (max-width: 960px) {
  .print-module { width: 100%; max-width: 560px }
  .print-body { flex-direction: column; padding: 0 20px }
  .print-preview { flex: 0 0 auto; width: 100%; height: auto; aspect-ratio: 1 }
  .print-config { min-height: auto }
}
</style>
</head>
<body>

<div class="print-module">
  <div class="print-title">Print Details</div>

  <div class="print-body">
    <!-- Preview -->
    <div class="print-preview">
      <span class="placeholder-text">Preview</span>
    </div>

    <!-- Configuration: labels | options -->
    <div class="print-config">
      <div class="config-labels">
        <div class="config-section"><span class="row-label">Wrap Type</span></div>
        <div class="config-section"><span class="row-label">Size</span></div>
        <div class="config-section"><span class="row-label">Quantity</span></div>
        <div class="config-section"><span class="row-label">Frame Type</span></div>
      </div>
      <div class="config-options">
        <div class="config-section"><div class="preset-grid wrap-grid" id="grid-wrap"></div></div>
        <div class="config-section"><div class="preset-grid size-grid" id="grid-size"></div></div>
        <div class="config-section">
          <div class="qty-wrap">
            <button class="qty-btn" id="qty-dec" aria-label="Decrease">&minus;</button>
            <span class="qty-num" id="qty-num">1</span>
            <button class="qty-btn" id="qty-inc" aria-label="Increase">+</button>
          </div>
        </div>
        <div class="config-section"><div class="preset-grid frame-grid" id="grid-frame"></div></div>
      </div>
    </div>
  </div>

  <!-- Order Tray -->
  <div class="order-tray">
    <div class="order-total">
      <span class="total-label">Total</span>
      <span class="total-pretax">(pre tax)</span>
      <span class="total-amount" id="total-amount">$78.99</span>
    </div>
    <button class="add-to-order" id="btn-add">Add To Order</button>
  </div>

  <!-- Material Tooltip -->
  <div class="material-tooltip" id="mat-tooltip"></div>
</div>

<script>
const WRAP_TYPES = [
  { key: 'paper_studio',     cat: 'Paper',  style: 'Studio',    desc: 'Smooth matte, 200gsm archival cotton.' },
  { key: 'paper_fineart',    cat: 'Paper',  style: 'Fine Art',  desc: 'Hahnem\u00fchle German Etching Gicl\u00e9e, 310gsm, textured warm-white cotton.' },
  { key: 'canvas_stretched', cat: 'Canvas', style: 'Stretched', desc: 'Gallery-wrapped cotton canvas, 380gsm, 1.5\u2033 bars.' },
  { key: 'framed_classic',   cat: 'Framed', style: 'Classic',   desc: 'Matted fine-art print in solid wood frame under glass.' },
];

const SIZES = [
  { key: '8x10',  label: '8 \u00d7 10',  price: 28.00 },
  { key: '12x12', label: '12 \u00d7 12', price: 42.00 },
  { key: '12x16', label: '12 \u00d7 16', price: 54.00 },
  { key: '18x24', label: '18 \u00d7 24', price: 78.99 },
];

const FRAME_TYPES = [
  { key: 'natural_wood',  label: 'Natural Wood' },
  { key: 'perspex_glaze', label: 'Perspex Glaze' },
];

const state = { wrap: 'paper_fineart', size: '12x12', frame: 'natural_wood', qty: 1 };

function btn(active, group, key, html) {
  return `<button class="preset-btn${active ? ' active' : ''}" onclick="pick('${group}','${key}')">${html}</button>`;
}

function renderAll() {
  // Wrap type — vertical stack, compound labels
  document.getElementById('grid-wrap').innerHTML = WRAP_TYPES.map(w =>
    btn(w.key === state.wrap, 'wrap', w.key,
      `<span class="pb-cat">${w.cat}</span><span class="pb-dot">&middot;</span><span class="pb-style">${w.style}</span>`)
  ).join('');

  // Size — 3-across flex
  document.getElementById('grid-size').innerHTML = SIZES.map(s =>
    btn(s.key === state.size, 'size', s.key, s.label)
  ).join('');

  // Frame type — inline
  document.getElementById('grid-frame').innerHTML = FRAME_TYPES.map(f =>
    btn(f.key === state.frame, 'frame', f.key, f.label)
  ).join('');

  // Total
  const sz = SIZES.find(s => s.key === state.size);
  document.getElementById('total-amount').textContent = '$' + (sz ? (sz.price * state.qty).toFixed(2) : '0.00');

  // Tooltip
  const w = WRAP_TYPES.find(w => w.key === state.wrap);
  const tip = document.getElementById('mat-tooltip');
  if (w) { tip.textContent = w.desc; tip.classList.add('visible'); }

  // Qty
  document.getElementById('qty-num').textContent = state.qty;
  document.getElementById('qty-dec').disabled = state.qty <= 1;
  document.getElementById('qty-inc').disabled = state.qty >= 10;
}

function pick(group, key) {
  state[group] = key;
  renderAll();
}

document.getElementById('qty-dec').addEventListener('click', () => { if (state.qty > 1) { state.qty--; renderAll(); } });
document.getElementById('qty-inc').addEventListener('click', () => { if (state.qty < 10) { state.qty++; renderAll(); } });

document.getElementById('btn-add').addEventListener('click', () => {
  const sz = SIZES.find(s => s.key === state.size);
  console.log('Order:', { ...state, total: sz ? sz.price * state.qty : 0 });
});

renderAll();
</script>
</body>
</html>
