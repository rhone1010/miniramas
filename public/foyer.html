/* ── stage ── */
/* FOYER GLASS: each source keeps its own .stage/.deck at its own breakpoint.
   Desktop is foyer desktop.html; mobile is foyer -mobile.html, whose mobile
   block (below) was written on top of these. */
@media (min-width:721px){
.stage{ flex:1 1 auto; min-height:0; width:100%; max-width:1360px; position:relative; padding:10px 16px 40px }
.deck{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; gap:0; height:clamp(500px,64vh,640px); flex:0 0 auto }
}
@media (max-width:720px){
.stage{ flex:1; width:100%; max-width:1360px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 16px 40px; position:relative }
.deck{ margin:0 auto }
.deck{ position:relative; display:flex; align-items:center; justify-content:center; gap:0; height:clamp(500px,64vh,640px) }
}
/* card + side cards */
.cardwrap{ perspective:1600px; position:relative; z-index:4 }
.card{ position:relative; height:clamp(500px,64vh,640px); width:auto; aspect-ratio:var(--ar); z-index:4; transform-style:preserve-3d; transition:transform 1.5s cubic-bezier(.45,.05,.25,1) }
.card.flipped{ transform:rotateY(180deg) }
.card.flipping{ animation:flipDepth 1.5s cubic-bezier(.45,.05,.25,1) }
@keyframes flipDepth{ 0%{ scale:1 } 50%{ scale:.9 } 100%{ scale:1 } }
.face{ position:absolute; inset:0; border-radius:16px; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  box-shadow:0 1.8rem 3.8rem rgba(52,30,25,.34), 0 .3rem .8rem rgba(0,0,0,.2); border:1px solid rgba(215,189,137,.45) }
.face.back{ transform:rotateY(180deg); background:#3a2b24 }
.face img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 38% }
.empty{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:#f3ede1; padding:24px; background:linear-gradient(160deg,#7d4242,#3a1c1c); cursor:pointer }
.empty svg{ width:46px; height:46px; stroke:var(--gold-soft); fill:none; stroke-width:1.3; margin-bottom:12px }
.empty b{ display:block; font-family:var(--serif); font-size:1.5rem; font-weight:500 } .empty span{ font-size:.9rem; color:rgba(243,237,225,.72) }
.flip{ position:absolute; inset:0; background-size:cover; background-position:center 32%; opacity:0; transition:opacity .18s ease } .flip.on{ opacity:1 }
.grad{ position:absolute; inset:0; background:linear-gradient(transparent 45%, rgba(20,15,10,.78)); opacity:0; transition:opacity .4s } .card.telling .grad{ opacity:1 }
.wm{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--sans); font-size:12px; letter-spacing:.2em; color:rgba(255,255,255,.5);
  background:repeating-linear-gradient(45deg, rgba(0,0,0,.10) 0 3px, transparent 3px 22px); pointer-events:none }
.nm{ position:absolute; left:0; right:0; bottom:0; padding:22px 16px 14px; background:linear-gradient(transparent, rgba(20,15,10,.82)); font-family:var(--serif); font-size:1.3rem; color:#fff; text-align:left }
/* side cards (desktop pull-apart) */
/* ── fan (desktop reveal): 6 cards, absolutely centred on the deck, each
   positioned by JS. Bow follows Review (centre highest); rotation is an
   outward splay. All motion is transform/opacity on one curve. ── */
.fan{ display:contents }                       /* wrappers are inert; cards self-position */
.fc{ position:absolute; left:50%; top:50%; width:clamp(200px,16vw,268px); aspect-ratio:var(--ar);
  border-radius:12px; overflow:hidden; z-index:2;
  box-shadow:0 1rem 2.4rem rgba(52,30,25,.32); border:1px solid rgba(215,189,137,.4); background:#3a2b24;
  opacity:0; transform:translate(-50%,-50%) translate(0px,0px) rotate(0deg) scale(.8);   /* collapsed 'from' at centre, behind the result */
  /* FOYER GLASS: one ease-in-out curve -- leaves the stack gently, travels, settles gently.
     The from and to transforms list the same functions, so each part interpolates on its own. */
  transition:opacity .6s cubic-bezier(.4,0,.2,1), transform 1.1s cubic-bezier(.4,0,.2,1) }
.fc img{ width:100%; height:100%; object-fit:cover; object-position:50% 38% }
/* mobile grid (2x3 backfill behind the shrunk result) */
.mgrid{ display:none }
.gc img{ width:100%; height:100%; object-fit:cover; object-position:50% 38% }
/* ── tagline (split) ── */
.opening{ position:absolute; bottom:calc(50% + clamp(270px,34vh,345px)); left:0; right:0; font-family:var(--serif); font-size:clamp(1.6rem,3.6vw,2.4rem); line-height:1.2; text-align:center; color:var(--ink); margin:0 }
.opening span{ color:var(--ox); font-style:italic }
body.telling-page .opening, body.revealing .opening{ display:none }
.tag{ position:absolute; top:calc(50% + clamp(260px,33vh,335px)); left:0; right:0; font-family:var(--serif); font-size:clamp(1.4rem,3.4vw,2.4rem); text-align:center; color:var(--ink); margin:0; min-height:1.4em; line-height:1.25 }
.tag .tail{ color:var(--ox); font-style:italic }
/* PRODUCTION: "Try again", in the card's caption band, is the band's own
   type made a real button -- italic, in the gold the phone gives the line's
   emphasis, no chrome of its own, a ring for the keyboard. */
.nm .again, .tag .again{ font-family:inherit; font-size:inherit; font-weight:inherit; line-height:inherit; letter-spacing:inherit; font-style:italic; color:var(--gold-soft); background:none; border:0; padding:0; margin:0; cursor:pointer }
.nm .again:focus-visible, .tag .again:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; border-radius:4px }
/* FOYER GLASS: the 14ch column is lifted, desktop and phone alike. At 14ch
   the two wider lines wrapped to 3 lines on desktop (into the button) and
   "Impossible worlds become real in our crafted images." to 5 on a phone
   (off the bottom of the screen) -- in both source files. Unwrapped they
   run like every other line: one line on desktop, two on a phone. */
.tag.wide{ max-width:none; margin-left:auto; margin-right:auto }
/* ── actions ── */
.acts{ display:flex; gap:14px; margin-top:26px }
.acts.done{ display:none !important }  /* buttons vanish once a photo is chosen */
.pbtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; aspect-ratio:5/4; width:138px; border-radius:10px; cursor:pointer;
  font-family:var(--serif); font-size:1.15rem; letter-spacing:.01em; line-height:1.15; transition:transform .18s ease, box-shadow .18s ease }
.pbtn svg{ width:28px; height:28px; fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; opacity:.9 }
.pbtn--cam{ background:linear-gradient(168deg,#7d4242,#5c3030); color:#f3ede1; border:1px solid var(--gold-soft) } .pbtn--cam svg{ stroke:var(--gold-soft) }
.pbtn--pick{ background:linear-gradient(168deg,#fbf7ef,#efe7d8); color:var(--ox); border:1px solid rgba(125,66,66,.5) } .pbtn--pick svg{ stroke:var(--ox) }
.pbtn:hover{ transform:translateY(-2px); box-shadow:0 .7rem 1.6rem rgba(52,30,25,.22) }
/* FOYER GLASS: the ONE button. Its top sits 150px below the card -- half the
   card height, clamp(250px,32vh,320px), plus 150px -- the room the animated
   line lives in. It waits at 2/3 of its final size (.77 of 1.15), grown from
   its top edge so the 150px holds, and grows on an ease-in-out curve. */
.go{ position:absolute; left:50%; top:calc(50% + clamp(250px,32vh,320px) + 150px); font-family:var(--serif); font-style:italic; font-size:1.4rem; padding:15px 36px; border-radius:10px; background:var(--ox); color:#f6ecd8; border:1px solid var(--ox-line); cursor:pointer; pointer-events:none; opacity:0; transform-origin:center top; transform:translateX(-50%) scale(.77); transition:transform 1.1s cubic-bezier(.4,0,.2,1), opacity .5s ease; z-index:6 }
.go.in{ opacity:1; pointer-events:auto; transform:translateX(-50%) scale(.77) }
.go.full{ transform:translateX(-50%) scale(1.15) translateY(-10px) }
@media(max-width:720px){ .go.in{ transform:translateX(-50%) } .go.full{ transform:translateX(-50%) scale(1.2) } }
@media(min-width:721px){ .pbtn--cam{ display:none } }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(215,189,137,.6) } 70%{ box-shadow:0 0 0 14px rgba(215,189,137,0) } 100%{ box-shadow:0 0 0 0 rgba(215,189,137,0) } }
.go::after{ content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none }
.go.full::after{ animation:pulse 1.8s ease-out infinite }
/* ── swipe pill (mobile) ── */
.pill{ display:none !important; align-items:center; justify-content:center; gap:10px; margin:16px auto 0; padding:10px 10px; height:34px;
  background:rgba(20,14,11,.9); border:1px solid var(--gold-soft); box-shadow:0 .4rem 1rem rgba(0,0,0,.4); border-radius:999px;
  -webkit-clip-path:polygon(0 50%, 7px 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 7px 100%); clip-path:polygon(0 50%, 7px 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 7px 100%);
  width:120px }
.pill.on{ display:flex } .pill i{ width:8px; height:8px; border-radius:50%; background:rgba(243,237,225,.45) } .pill i.on{ background:var(--gold-soft); box-shadow:0 0 6px rgba(215,189,137,.8) }
.pill.at0{ padding-left:14px } .pill.atLast{ padding-right:14px }
input[type=file]{ display:none }

/* ═══════════ DESKTOP · LAYOUT + SHORT-VIEWPORT FIT (FOYER GLASS) ═══════════
   Rich, 2026-09-11: nothing sits above the card but the logo -- the opening
   line has moved below it -- and the whole card mechanism rides 75px higher.
   Under the 166px logo the stage holds, top to bottom:
      49px   clear under the logo (the 124px the opening line used to need
             above the card, less the 75px the mechanism moved up)
     card
     --gap   the room below the card: the opening line before a photo, the
             animated line from the photo on; card bottom to button top
      72px   Come Inside & Explore at its full size + 16px clear
   --gap is 150px on screens 1000px tall and up and gives way on shorter
   ones, down to 75px at 768 -- the least that holds one line of the riffle
   with 12px clear of the button -- and the card takes what it gives up:
       --gap    = clamp(75px, 75px + (100vh - 768px) x 0.323, 150px)
       --card-h = min(640px, 100vh - 166 - 49 - --gap - 72)
   Where there is room the card sits 75px above the stage's centre
   (50% - 75px); it rises further only when that would push the button off
   the screen. Everything below the card hangs from it with the offsets it
   had (15px for either line, --gap for the button), so it all moves as one.
   The fan is scaled to match in fanReveal(). */
@media (min-width:721px){
  .stage{ --gap:clamp(75px, calc(75px + (100vh - 768px) * 0.323), 150px);
          --card-h:min(640px, max(220px, calc(100vh - 287px - var(--gap))));
          --deck-y:clamp(calc(49px + var(--card-h) / 2), calc(50% - 75px), calc(100% - var(--gap) - 72px - var(--card-h) / 2)) }
  .deck{ top:var(--deck-y); height:var(--card-h) }
  .card{ height:var(--card-h) }
  /* Both lines below the card, one at a time in the same place: the opening
     line until a photo is chosen, then the animated line. */
  .opening{ top:calc(var(--deck-y) + var(--card-h) / 2 + 15px); bottom:auto }
  .tag{ top:calc(var(--deck-y) + var(--card-h) / 2 + 15px) }
  body:not(.telling-page) .tag{ visibility:hidden }
  .go{ top:calc(var(--deck-y) + var(--card-h) / 2 + var(--gap)) }
  /* THE CTA'S FINAL STATE (Rich's DevTools mockup, 2026-09-12): 25px higher,
     optically centred at 52%, at 1.2. It is still ONE animation: the button
     waits at .77 (.in) and grows to 1.2 as the endpoint of its existing
     transform -- no separate scale property that could compound with it --
     and the -25px and 52% travel with the growth on the same curve, so
     nothing jumps. The waiting position (150px under the card, 50%) is
     unchanged. */
  .go{ transition:transform 1.1s cubic-bezier(.4,0,.2,1), left 1.1s cubic-bezier(.4,0,.2,1), margin-top 1.1s cubic-bezier(.4,0,.2,1), opacity .5s ease }
  .go.full{ transform:translateX(-50%) scale(1.2) translateY(-10px); margin-top:-25px; left:52% }
  /* THE CARD IS THE UPLOAD CONTROL -- no separate button on desktop. The
     invisible gradient layer above the card's face must not take the click
     meant for it; a keyboard focus ring, drawn inside the rounded card. */
  .acts{ display:none !important }
  .face .grad{ pointer-events:none }
  .empty:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:-8px }
}

/* ═══════════ MOBILE — the card IS the screen ═══════════ */
@media (max-width:720px){
  html,body{ height:100dvh; overflow:hidden }
  .montage{ display:none } body{ background:linear-gradient(170deg,#7d4242,#3a1c1c) } .wrap{ background:transparent }
  .opening{ color:#f6ecd8; font-size:1.5rem; margin:10px 16px 8px } .opening span{ color:var(--gold-soft) }
  .wrap{ height:100dvh }
  .logo{ display:none }                  /* logo moves onto the card */
  .stage{ justify-content:flex-start; padding:0; height:100dvh; overflow:hidden }
  .deck{ width:100%; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:0; transform:translateY(-40px) } .cardwrap{ width:100%; display:flex; justify-content:center; perspective:1600px }
  .fan{ display:none !important }
  .card{ width:90vw; height:auto; aspect-ratio:var(--ar); border-radius:16px }
  .face{ border-radius:16px; border:1px solid rgba(215,189,137,.4) }
  .face img,.flip,.cyc{ object-position:50% 38% }
  /* front (empty) = full-screen oxblood with logo + prompt on it */
  .empty{ background:linear-gradient(165deg,#7d4242,#3a1c1c) }
  .empty .fs-logo{ position:absolute; top:8vh; left:0; right:0; text-align:center }
  .empty .fs-logo img{ width:150px; height:auto; display:block; margin:0 auto }
  /* tagline overlays the card, near the lower third, over the gradient */
  .tag{ position:absolute; left:0; right:0; bottom:calc(14% + 25px); z-index:6; color:#f6ecd8; font-size:1.5rem; margin:0; padding:0 24px; text-shadow:0 1px 10px rgba(0,0,0,.5); min-height:0 }
  .tag .tail{ color:var(--gold-soft) }
  /* actions float over the card near the bottom */
  .acts{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(28px + env(safe-area-inset-bottom) + var(--kb,0px)); z-index:20; margin:0; gap:12px }
  .acts.done{ display:none !important }
  .pbtn{ width:130px; box-shadow:0 .6rem 1.6rem rgba(20,12,10,.45) }
  /* FOYER GLASS: foyer -mobile.html's own rule, with ONE change -- raised
     from 28px to 96px above the bottom (the height foyer desktop.html gives
     it on a phone). The rest of what reached this button on a phone in the
     mobile source came from its base .go, which here is the desktop one, so
     it is restated: top edge as the origin, the .5s transitions, and the
     pulse on the button itself. */
  .go{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom) + var(--kb,0px)); z-index:20; margin:0; padding:15px 34px; box-shadow:0 .6rem 1.6rem rgba(20,12,10,.45) }
  .go{ top:auto; transform-origin:center top; transition:opacity .5s ease, transform .5s ease }
  .go.full{ animation:pulse 1.8s ease-out infinite } .go.full::after{ animation:none }
  /* the result card's shadow deepens as it eases down, rather than switching */
  .card{ transition:transform 1.5s cubic-bezier(.45,.05,.25,1), box-shadow 1.2s cubic-bezier(.65,0,.35,1) }
  /* swipe pill floats just above the caret */
  /* mobile reveal: result shrinks to centre; 2x3 grid backfills behind it */
  body.gridding .cardwrap{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; pointer-events:none }
  body.gridding .card{ height:min(46vh,380px); width:auto; aspect-ratio:var(--ar); z-index:50; position:relative; box-shadow:0 1.6rem 3.4rem rgba(15,9,7,.7), 0 .4rem 1rem rgba(0,0,0,.4) }
  body.gridding .cardwrap{ position:relative }
  /* FOYER GLASS: rows fixed at a third of the screen, as the three 1fr rows
     were, so a fourth row can continue the mosaic below them -- past the
     bottom of the screen, which is intended. */
  .mgrid{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,calc(100% / 3)); grid-auto-rows:calc(100% / 3); gap:0; position:fixed; inset:0; z-index:1; padding:0; margin:0 }
  .mgrid .gc{ border-radius:0 !important; border:0 !important; margin:0 }
  .mgrid .gc{ overflow:hidden } .mgrid .gc img{ display:block; width:100%; height:100%; object-fit:cover }
  .gc{ aspect-ratio:var(--ar); border-radius:10px; overflow:hidden; opacity:0; transform:scale(.92);
    box-shadow:0 .6rem 1.4rem rgba(20,12,10,.4); border:1px solid rgba(215,189,137,.3);
    transition:opacity .5s ease, transform .5s cubic-bezier(.16,.8,.3,1) }
  .gc.in{ opacity:.9; transform:none }
  .nm{ font-size:1.35rem }
}
@media (min-width:721px){ .pill{ display:none !important } }
@media (prefers-reduced-motion:reduce){ .card,.side,.go,.fc,.cardwrap{ transition:none !important; animation:none !important } }

<script>
var IS_MOBILE=matchMedia('(max-width:720px)').matches;

/* ═══════════════════════════════════════════════════════════════════════
   LITEN & CO — FOYER · PRODUCTION (served at /)
   ───────────────────────────────────────────────────────────────────────
   foyer-working-files/foyer-final-glass.html, the locked glass, made real
   (2026-09-12). The design is the glass's, unchanged. What production
   replaces is the glass's stand-in and its one placeholder:
     simulateGeneration()  -> the real reveal: the photograph is fitted
                              (the Portraits fitting), examined
                              (/api/v1/foyer/intake) and rendered once on
                              NB2 (/api/v1/foyer/reveal), and the
                              watermarked result comes back through the same
                              generationReady() door.
     the CTA's alert()     -> /discovery, carrying the fitted photograph and
                              the detected subject (foyer-handoff.js).
   plus the three ways a reveal can not happen -- it failed, the photograph
   was refused, the free previews are used -- each settling on the
   visitor's own photograph with Come Inside & Explore (see settle()).

   The glass's own notes follow.
   ───────────────────────────────────────────────────────────────────────
   Assembled 2026-09-11 from the two approved sources in this folder:
     foyer desktop.html   the desktop design (>=721px)
     foyer -mobile.html   the mobile design  (<=720px)
     foyer-DATA.js        the flip mapping: FLIPS, REVEAL_POOL, IMG()

   GLASS. No generation, no auth, no Discovery. The one thing standing in
   for production is simulateGeneration(), which reports a canned result
   through generationReady() -- the same door the real render will use.

   THE SEQUENCE
     1 OPENING    "Choose a photo" (desktop); + "Take a photo" (mobile).
     2 PHOTO      their photograph becomes the card.
                  Desktop: Come Inside & Explore appears, at 2/3 size,
                  150px below the card -- the room the line lives in.
     3 RIFFLE     the card riffles FLIPS with the synced "Imagine
                  yourself <tail>" line. Storytelling, not a progress bar.
     4 RESULT     generationReady(): the riffle stops where it is, the
                  card turns over to THEIR result.
     5 HOLD       2 seconds on the result, fully visible, nothing moving.
     6 OPEN       desktop: six cards fan out from behind the result and the
                  button grows to full size as they land.
                  mobile: the result eases down to centre, the 2x3 grid
                  fills in behind it, the button grows.
   ═══════════════════════════════════════════════════════════════════════ */

/* foyer-DATA.js carries FLIPS, REVEAL_POOL and IMG(). These two lists it
   does not carry, and they stay exactly as both source files have them. */
/* WIDER promise, after the tails run */
var WIDE = ['Your photo, imagined hundreds of ways.','Impossible worlds become real in our crafted images.'];
/* FAN / GRID — 6 showcase cards shown after the hold (Rich's picks). */
var FAN = ['flip_23','flip_26','flip_24','flip_13','flip_06','flip_16'];
/* MOBILE MOSAIC, a fourth row below the six. Neither is in FAN or REVEAL_POOL,
   so the mosaic never repeats itself or the result. */
var MOSAIC_MORE = ['flip_17','flip_11'];

/* IMAGES. IMG() from foyer-DATA.js is the mapping, and it returns a site
   path (/previews/foyer-flip/<id>.jpg). Served from the site, that path is
   used as it is. Opened straight from disk, a site path points nowhere, so
   the same path is read from the repo's public/ folder beside this one. */
function imgFor(id){ var p = IMG(id); return location.protocol === 'file:' ? '../public' + p : p; }

/* TIMING. The riffle, line, photo beat and simulated-result values are the
   source files' own. HOLD is Rich's 2 seconds. FAN_MS and SHRINK_MS match
   the transitions in the stylesheet. */
var PHOTO_BEAT    = 600;     /* photograph shows before the riffle starts   */
var RIFFLE_EVERY  = 300;     /* card riffle                                 */
var LINE_EVERY    = 600;     /* the line is rewritten every 2nd frame       */
var FLIP_MS       = 1500;    /* .card turn -- matches its transition        */
/* HOLD, measured, not nominal. The hold starts at the turn's transitionend,
   which lands ~117ms after the result has visibly settled, and the first fan
   frame follows the hold by ~50ms: a 2000ms hold measured 2166ms from
   visibly settled to first fan motion. Desktop is tuned (Rich, 2026-09-12)
   so that interval measures ~2.0s; the phone keeps its approved 2s hold. */
var HOLD_MS       = IS_MOBILE ? 2000 : 1830;
var FAN_STAGGER   = 90;      /* desktop fan, card to card                   */
var FAN_MS        = 1100;    /* desktop fan travel -- matches .fc           */
var SHRINK_MS     = 1200;    /* mobile result easing down to centre         */
var CARD_MAX_H    = 640;     /* desktop card height at full size -- matches --card-h's cap */
var FAN_SCALE     = 1.5;     /* the six fan cards, against their earlier size */

/* montage bg (desktop) */
(function(){ var m=document.getElementById('montage'); if(!m) return;
  var spots=IS_MOBILE?[[-6,4,150],[70,2,150],[-8,60,150],[74,58,150]]
                     :[[2,6,220],[80,2,240],[-2,52,230],[82,50,240],[16,64,200],[64,66,210]];
  spots.forEach(function(sp,i){ var t=document.createElement('div'); t.className='tile'; var id=FLIPS[i%FLIPS.length][0];
    t.style.cssText='left:'+sp[0]+'%;top:'+sp[1]+'%;width:'+sp[2]+'px;height:'+(sp[2]/.75)+'px;background-image:url('+imgFor(id)+')'; m.appendChild(t); });
})();

/* DESKTOP HAS ONE PHOTO ACTION. The stylesheet already hides the camera
   above 720px; removing it here as well means there is no camera control
   in a desktop page at all, visible or not. */
if (!IS_MOBILE){ ['btnCamera','cam','btnUpload'].forEach(function(id){ var el=document.getElementById(id); if(el) el.parentNode.removeChild(el); }); }

/* DESKTOP: THE CARD IS THE UPLOAD CONTROL. The separate Choose a Photo
   button is gone (above); the card reads Start Here / Choose a Photo under
   its camera, the whole card opens the picker (it always did on click --
   see #empty below), and it is a real button to a keyboard: focusable,
   Enter or Space to choose. The phone keeps its own card and buttons. */
if (!IS_MOBILE){ (function(){
  var e=document.getElementById('empty'); if(!e) return;
  var b=e.querySelector('b'), sp=e.querySelector('span');
  if (b) b.textContent='Start Here'; if (sp) sp.textContent='Choose a Photo';
  e.setAttribute('role','button'); e.setAttribute('tabindex','0'); e.setAttribute('aria-label','Start Here. Choose a Photo');
  e.addEventListener('keydown', function(ev){ if (ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); document.getElementById('file').click(); } });
})(); }

var card=document.getElementById('card'), front=document.getElementById('front'), back=document.getElementById('back'), tag=document.getElementById('tag');
var go=document.getElementById('go'), acts=document.getElementById('acts');
/* Come Inside & Explore is in the page from the start but invisible (opacity 0,
   no pointer events) until .in -- and until then it is inert, so Tab, Enter
   and Space cannot reach a button nobody can see. Showing it and making it a
   working control happen together, here, and nowhere else. */
function showGo(){ go.classList.add('in'); go.removeAttribute('inert'); }
var RESULT=null;

/* One place for the sequence's state, and every pending timer, so the
   result can stop whatever is running the moment it arrives. */
var STATE = { phase:'opening', result:null, riffleStart:null, riffle:null };
function later(fn, ms){ return setTimeout(fn, ms); }

/* STATE 2: source photo becomes the card */
function begin(src){
  if (STATE.phase !== 'opening') return;
  STATE.phase = 'photo';
  acts.classList.add('done');  /* photo chosen -> buttons go */
  var e=front.querySelector('.empty'); if(e) e.style.background='none';
  front.innerHTML='<img src="'+src+'">'+(front.querySelector('.grad')?front.querySelector('.grad').outerHTML:'<div class="grad"></div>');
  /* Desktop: the ONE Come Inside & Explore button, present from here on at
     2/3 of its final size. Mobile shows it at the result, as its source does. */
  if (!IS_MOBILE) showGo();
  /* Desktop: both lines live below the card, one at a time -- the opening
     line gives way to the animated one the moment there is a photo. */
  if (!IS_MOBILE) document.body.classList.add('telling-page');
  /* PRODUCTION: no free preview is coming (the allowance said so before the
     photograph was chosen), so nothing riffles -- their photograph stays on
     the card and Come Inside & Explore is the one next step. Otherwise the
     riffle runs until the real result, or a reason there is none, arrives. */
  if (FOYER.free === false) settle(FOYER.why || 'unavailable');
  else STATE.riffleStart = later(startRiffle, PHOTO_BEAT);
}

/* STATE 3: riffle + synced line */
function startRiffle(){
  STATE.riffleStart = null;
  if (STATE.phase !== 'photo') return;
  STATE.phase = 'riffle';
  document.body.classList.add('telling-page');
  front.innerHTML='';
  FLIPS.forEach(function(r,i){ var f=document.createElement('div'); f.className='flip'+(i===0?' on':''); f.style.backgroundImage='url('+imgFor(r[0])+')'; front.appendChild(f); });
  var g=document.createElement('div'); g.className='grad'; front.appendChild(g); card.classList.add('telling');
  /* ONE CLOCK: THE FRAME AND ITS LINE ARE ONE STATE. The source files ran
     the frames (300ms) and the line (600ms) on separate timers with separate
     counters, so the line described a frame two or more places away from the
     one on the card. Now a single tick puts up the next frame, and every
     other tick -- the line's old 600ms cadence, so it stays readable -- the
     line is rewritten in the same step, from the frame now on the card:
       a frame with a caption  -> "Imagine yourself <its caption>"
       a frame without one     -> "Imagine yourself…", the opening words,
                                  which describe no frame at all
     Between rewrites the line stays up for the one frame that passes. It is
     never set from any frame but the one showing. FLIPS has an odd number of
     frames, so the second pass captions the frames the first pass skipped,
     and every caption has appeared by the time the wider lines take over --
     after FLIPS.length rewrites, 16.2s, when the old timer switched too.
     The wider lines describe no frame; the frames keep riffling under them. */
  var flips=front.querySelectorAll('.flip'), shown=0, ticks=0, rewrites=0;
  var EVERY = Math.round(LINE_EVERY / RIFFLE_EVERY);          // frames per rewrite: 2
  function caption(k){ var tl=FLIPS[k][1];
    tag.innerHTML = tl ? 'Imagine yourself <span class="tail">'+tl+'</span>' : 'Imagine yourself&hellip;'; }
  caption(0);                                                  // frame 0 is up; its line with it
  var iv=setInterval(function(){
    ticks++; shown = ticks % flips.length;
    flips.forEach(function(f,j){ f.classList.toggle('on',j===shown); });
    if (ticks % EVERY) return;                                 // the in-between frame: the line holds
    rewrites++;
    if (rewrites < FLIPS.length) caption(shown);
    else { tag.classList.add('wide'); tag.textContent=WIDE[(rewrites-FLIPS.length)%WIDE.length]; }
  }, RIFFLE_EVERY);
  STATE.riffle = { iv:iv };
}
function stopRiffle(){
  if (STATE.riffleStart){ clearTimeout(STATE.riffleStart); STATE.riffleStart = null; }
  if (STATE.riffle){ clearInterval(STATE.riffle.iv); STATE.riffle = null; }       // frames and line stop together
}

/* ── THE SEAM ────────────────────────────────────────────────────────────
   Production calls this when the first real render is back:

       foyer.generationReady({ src: <image URL or data URL>, label: <name> })

   Whenever it arrives -- during the photo beat, mid-riffle, or long after
   the lines have widened -- the riffle stops where it is and the card turns
   to the result. Nothing waits for an animation to finish. The first result
   wins; any later call is ignored. The image is decoded before the card
   turns, so the back face is never blank mid-turn. */
function generationReady(result){
  if (STATE.result || STATE.phase === 'opening') return;
  STATE.result = result;
  var im = new Image(); im.src = result.src;
  var ready = im.decode ? im.decode() : Promise.resolve();
  ready.catch(function(){}).then(function(){ revealResult(result); });
}
window.foyer = { generationReady: generationReady };

/* ── PRODUCTION: THE REAL REVEAL ─────────────────────────────────────────
   Replaces the glass's simulateGeneration(). Nothing here changes a timing:
   the riffle runs for as long as the render takes, and the result comes in
   through generationReady() above, like the glass's canned one did.

     /api/v1/foyer/intake   the photograph's one safety check (face, age,
                            gender). Its signed verdict is what the reveal
                            accepts, and its subject is what Discovery gets.
     /api/v1/foyer/reveal   GET: is a free preview available at all?
                            POST: one NB2 render of one of the six foyer
                            effects, watermarked on the server. The clean
                            image never reaches this page.

   Only a photograph the intake passed is handed to Discovery. */
var FOYER = {
  free:    null,    /* true/false once /foyer/reveal has said; null = not yet  */
  why:     null,    /* when free is false: 'exhausted' (used) or 'unavailable' (could not be checked) */
  intake:  null,    /* the intake request for this photograph (a promise)      */
  handoff: null,    /* the handoff write; the CTA waits for it                  */
  run:     0        /* a Try again supersedes whatever the last run left out   */
};
var SRC = { b64:null, dataUrl:null };   /* the photograph, fitted once */

function foyerPost(url, body){
  return fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, credentials:'same-origin', body:JSON.stringify(body) })
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .catch(function(){ return null; });
}

/* The one existing browser marker, liten_anon -- set exactly as
   public/track.js sets it, which this page does not load. The allowance
   reads it as supporting evidence beside the IP. */
(function(){
  var ANON_KEY   = 'liten_anon'
  var YEAR_S     = 60 * 60 * 24 * 365
  function uuid () {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID()
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0
      var v = c === 'x' ? r : (r & 0x3) | 0x8
      return v.toString(16)
    })
  }

  function getCookie (name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)')
    return m ? decodeURIComponent(m.pop()) : null
  }

  function setCookie (name, value, maxAge) {
    try {
      document.cookie = name + '=' + encodeURIComponent(value) +
        ';path=/;max-age=' + maxAge + ';samesite=lax' +
        (location.protocol === 'https:' ? ';secure' : '')
    } catch (e) {}
  }
  if (!getCookie(ANON_KEY)) setCookie(ANON_KEY, uuid(), YEAR_S)
})();

/* Before a photograph is chosen: is there a free preview to be had? Anything
   that cannot be checked is a no -- fail closed -- and the visitor still
   comes inside. */
fetch('/api/v1/foyer/reveal', { credentials:'same-origin', cache:'no-store' })
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(d){
    FOYER.free = !!(d && d.available);
    FOYER.why  = FOYER.free ? null : (d && d.reason === 'exhausted' ? 'exhausted' : 'unavailable');
  })
  .catch(function(){ FOYER.free = false; FOYER.why = 'unavailable'; });

/* The intake, once per photograph, and the handoff that follows from it. */
function askIntake(){
  FOYER.intake = foyerPost('/api/v1/foyer/intake', { image_b64: SRC.b64 });
  FOYER.handoff = FOYER.intake.then(function(d){
    if (d && d.status === 'ok' && window.LitenHandoff)
      return LitenHandoff.put(SRC.dataUrl, { subject:d.subject, gender:d.gender, ageGroup:d.age_group })
        .catch(function(e){ console.warn('[foyer] handoff not written', e); });
    if (window.LitenHandoff) return LitenHandoff.clear();
  });
  return FOYER.intake;
}

function reveal(){
  var run = ++FOYER.run;
  (FOYER.intake || askIntake()).then(function(d){
    if (run !== FOYER.run) return;
    if (!d){ FOYER.intake = null; settle('failed'); return; }       /* not reached: ask again on Try again */
    if (d.status === 'refused'){ settle('refused'); return; }
    if (d.status !== 'ok'){ settle('unavailable'); return; }                /* the check could not be made */
    if (FOYER.free === false){ settle(FOYER.why || 'unavailable'); return; }
    foyerPost('/api/v1/foyer/reveal', { image_b64: SRC.b64, intake: d.intake }).then(function(v){
      if (run !== FOYER.run) return;
      if (v && v.status === 'ok' && v.image){ generationReady({ src: v.image, label: v.label }); return; }
      if (v && (v.status === 'exhausted' || v.status === 'unavailable')){ FOYER.free = false; FOYER.why = v.status; settle(v.status); return; }
      if (v && v.status === 'intake_required') FOYER.intake = null;  /* the verdict expired: look again */
      settle('failed');
    });
  });
}

/* ── WHEN THERE IS NO REVEAL ─────────────────────────────────────────────
   It failed, the photograph was refused, the free previews are used, or
   the free preview cannot be offered right now (the allowance or the
   photo check could not be made -- said without infrastructure talk). Each
   one stops the riffle, puts THEIR photograph back on the card, says what
   happened, and opens Come Inside & Explore. When no preview is coming
   (used, or not available) the button is the one pulsing next step; only a
   failure offers Try again.

   WHERE IT IS SAID: on the card, in the result card's own caption band
   (.nm), not on the line below it. The glass gives that line one line of
   room above the button and never shows it beside a grown button (desktop)
   or beside the button at all (phone); these sentences run two to four
   lines, and there they sat on top of the button. Inside the card nothing
   can collide with anything, at any size, and the button keeps its places.
   No new component: the band is the result card's, the button its own. */
var SAY = {
  failed:    'That one didn\'t come through. <button type="button" class="again" id="again">Try again</button>, or come inside and explore.',
  refused:   'We can\'t create a preview from this photo. You can still come inside and explore.',
  exhausted: 'Your free previews are used for now. Come inside and explore what\'s possible.',
  unavailable: 'Your free preview isn\'t available right now. Come inside and explore.'
};
function settle(kind){
  if (STATE.result || STATE.phase === 'opening') return;
  if (kind === 'failed' && FOYER.free === false) kind = FOYER.why || 'unavailable';
  if (STATE.phase === 'settled' && STATE.settled === kind) return;
  stopRiffle();
  STATE.phase = 'settled'; STATE.settled = kind;
  front.innerHTML = '<img src="'+SRC.dataUrl+'"><div class="nm" role="status">'+SAY[kind]+'</div>';
  card.classList.remove('telling');
  document.body.classList.add('telling-page');   /* the opening line goes, as it does once the riffle has run */
  tag.style.display = 'none';
  showGo();
  if (kind === 'exhausted' || kind === 'unavailable') go.classList.add('full');
  fitSettledCard();
}
/* Try again lives with the message, wherever the message is shown. */
document.addEventListener('click', function(e){ if (e.target && e.target.closest && e.target.closest('#again')) tryAgain(); });

/* SHORT PHONES, settled states only. On a phone the button is fixed near
   the foot of the screen, and the glass only ever shows it beside the SMALL
   result card. A settled state shows it beside the full-size card, and on a
   short screen (375x667) the button sat over the card and the end of its
   message. Three tiers, the first that fits wins:

   1 THE GLASS. The full-size card has room: nothing changes.
   2 A SMALLER CARD, message in its caption band. Same centre, same shape,
     just small enough to end 12px above the button (the clearance the
     glass keeps between its line and the button) -- as long as that leaves
     the card at least 220px wide.
   3 ULTRA-SHORT (Rich's ruling: 320x568). Below 220px the card stops being
     the foyer's card, so it stays at 220px and the message leaves the band:
     it goes on the page's own line (#tag), compact (20px, the Garamond
     floor) and centred, directly under the card, with Try again in it --
     card, 8px, message, 12px, button. At 320x568 even that does not fit
     above the button where the glass puts it (it would need ~80px more),
     so the button -- still fixed -- comes down only as far as the stack
     needs, and never so low that its grown, pulsing size leaves the screen.

   Measured from layout, not transforms; re-measured when the web fonts land
   and on resize. Try again puts everything back as the glass has it. */
var SETTLE_CLEAR = 12;       /* message or card -> button                          */
var SETTLE_GAP   = 8;        /* card -> message, ultra-short only                   */
var SETTLE_TOP   = 8;        /* the card's least distance from the top of the screen */
var SETTLE_MIN_W = 220;      /* the least card that is still the foyer's card       */
function clearSettledFit(){
  card.style.width = '';
  document.getElementById('deck').style.transform = '';
  go.style.bottom = '';
  ['top', 'bottom', 'fontSize', 'display'].forEach(function(p){ tag.style[p] = ''; });
  tag.removeAttribute('role');
  var nm = front.querySelector('.nm');
  if (nm && STATE.phase === 'settled' && !nm.innerHTML){ nm.innerHTML = SAY[STATE.settled]; nm.hidden = false; }
}
function fitSettledCard(){
  clearSettledFit();
  if (STATE.phase !== 'settled') return;
  tag.style.display = 'none';                                     /* tiers 1 and 2: the band speaks */
  if (!IS_MOBILE) return;
  var c = card.getBoundingClientRect();
  var cs = getComputedStyle(go), glassBottom = parseFloat(cs.bottom);
  var goTop = innerHeight - glassBottom - go.offsetHeight;
  var h = 2 * (goTop - SETTLE_CLEAR - (c.top + c.height / 2));
  if (h >= c.height) return;                                        /* 1 */
  var ar = c.width / c.height;
  if (h * ar >= SETTLE_MIN_W){ card.style.width = Math.floor(h * ar) + 'px'; return; }   /* 2 */

  /* 3: ultra-short */
  card.style.width = SETTLE_MIN_W + 'px';
  var nm = front.querySelector('.nm');
  if (nm){ nm.innerHTML = ''; nm.hidden = true; }
  tag.style.display = ''; tag.style.fontSize = '1.25rem'; tag.style.bottom = 'auto'; tag.style.top = '0px';
  tag.setAttribute('role', 'status');
  tag.innerHTML = SAY[STATE.settled];
  var cardH = card.getBoundingClientRect().height, msgH = tag.offsetHeight;
  var need = SETTLE_TOP + cardH + SETTLE_GAP + msgH + SETTLE_CLEAR;  /* everything above the button */
  if (need > goTop){
    var safe = glassBottom - 96;                                     /* 96px: the glass's mobile button offset */
    var least = safe + Math.max(16, Math.ceil(go.offsetHeight * 0.2) + 8);   /* room for its 1.2 growth */
    var bottom = Math.max(least, glassBottom - (need - goTop));
    go.style.bottom = bottom + 'px';
    goTop = innerHeight - bottom - go.offsetHeight;
  }
  var cardTop = Math.max(SETTLE_TOP, goTop - SETTLE_CLEAR - msgH - SETTLE_GAP - cardH);
  var now = card.getBoundingClientRect().top;
  document.getElementById('deck').style.transform = 'translateY(' + (-40 + cardTop - now) + 'px)';
  var stageTop = tag.offsetParent ? tag.offsetParent.getBoundingClientRect().top : 0;
  tag.style.top = (cardTop + cardH + SETTLE_GAP - stageTop) + 'px';
}
window.addEventListener('resize', function(){ if (STATE.phase === 'settled') fitSettledCard(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (STATE.phase === 'settled') fitSettledCard(); });

function tryAgain(){
  if (STATE.phase !== 'settled' || STATE.settled !== 'failed') return;
  STATE.phase = 'photo'; STATE.settled = null;
  clearSettledFit();
  tag.style.display = '';
  tag.classList.remove('wide');
  tag.innerHTML = 'Imagine yourself&hellip;';
  STATE.riffleStart = later(startRiffle, PHOTO_BEAT);
  reveal();
}

/* STATE 4: one result, fully visible, held, then the fan/grid.
   PRODUCTION: the result arrives with the Liten & Co watermark already
   baked into its pixels on the server, so the glass's CSS PREVIEW overlay
   is not laid over it -- one mark, not two. */
function pv(src,label){ return '<img src="'+src+'"><div class="nm">'+label+'</div>'; }
function revealResult(result){
  stopRiffle();
  STATE.phase = 'reveal';
  RESULT = [result.id || '', result.label];
  document.body.classList.add('revealing');
  tag.style.display='none'; acts.classList.add('done');
  back.innerHTML=pv(result.src,result.label);
  card.classList.remove('telling'); card.classList.add('flipping','flipped');
  showGo();  // 'Come Inside & Explore' present from the result on (desktop: already)

  /* STATE 5: the hold starts when the turn has finished -- when their result
     is fully visible -- not when it started. transitionend is the signal;
     the timer is the fallback for when there is no transition to end
     (reduced motion). */
  var shown=false;
  function fullyVisible(){
    if (shown) return; shown=true;
    card.removeEventListener('transitionend', onTurn);
    card.classList.remove('flipping');
    STATE.phase = 'hold';
    STATE.heldAt = Date.now();
    later(openFoyer, HOLD_MS);
  }
  function onTurn(e){ if (e.target===card && e.propertyName==='transform') fullyVisible(); }
  card.addEventListener('transitionend', onTurn);
  later(fullyVisible, FLIP_MS + 150);
}

/* STATE 6 */
function openFoyer(){
  STATE.phase = 'open';
  if(IS_MOBILE){ gridReveal(); } else { fanReveal(); }
  invite();
}
function invite(){
  showGo();
  tag.style.display='none';
  /* Mobile: its source's timing. Desktop: fanReveal() starts the button's
     growth with the last card's move, so it reaches its final 1.2 on the
     frame the fan completes -- not before, not after. */
  if (IS_MOBILE) later(function(){ go.classList.add('full'); }, 120*FAN.length + 500);
}
/* desktop: 6 cards on a Review bow with an outward rotational splay.
   Order across the arc, left->right: L3 L2 L1 [result] R1 R2 R3.
   cardW*0.62 spacing (Review), stepped down the bow, rotate outward 6/12/19.
   Each card leaves the stack behind the result and travels to its place on
   one eased curve; the transform lists match from and to, so translate,
   rotate and scale each interpolate on their own. */
function fanReveal(){
  var L=document.getElementById('fanL'), R=document.getElementById('fanR'); L.innerHTML=''; R.innerHTML='';
  var left=FAN.slice(0,3), right=FAN.slice(3,6);           // [inner,mid,outer]
  var order = [];
  left.forEach(function(id,k){ order.push({id:id, side:-1, step:k+1}); });   // step 1 inner .. 3 outer
  right.forEach(function(id,k){ order.push({id:id, side: 1, step:k+1}); });
  var cards=[];
  order.forEach(function(o){ var d=fanCard(o.id); (o.side<0?L:R).appendChild(d); d._o=o; d.setAttribute('data-flip',o.id); cards.push(d); });
  /* SHORT VIEWPORTS: the whole fan scales with the result card. K is the
     card's height against the design's 640px -- 1 on a tall screen, so the
     fan is exactly as designed there. Width, spacing and the vertical step
     all take the same factor, so the composition keeps its proportions;
     the outward rotations are angles and do not scale. */
  var K = Math.min(1, (card.offsetHeight || CARD_MAX_H) / CARD_MAX_H);
  /* 1.5x THE FAN (Rich, 2026-09-11). The cards are FAN_SCALE times their
     earlier size. Centre to centre they now step 0.52 of a card width
     (was 0.62 of the smaller card): in pixels the fan still opens wider
     than before, each card shows about half its width past its inner
     neighbour, and the inner pair clear the result card by ~45% of their
     width -- a fan, not a pile. The fan is never wider than the screen:
     three steps plus the outer card's turned half-width (0.709 of a card
     width at 19deg) each side, 24px clear. The vertical step scales with
     the cards, so the bow keeps its shape; the rotations are unchanged. */
  var SPREAD = 0.52;
  var base = cards[0].offsetWidth || 240;
  var CW = Math.min(base * K * FAN_SCALE, (innerWidth - 48) / (2 * (3 * SPREAD + 0.709)));
  var S = CW / base;                                        // the fan's size against its original
  cards.forEach(function(d){ d.style.width = CW + 'px'; });
  var spacing = CW * SPREAD;
  var ROT = [6,12,19];                                      // outward splay per step
  function place(d){ var o=d._o;
    var x = o.side * (spacing * o.step);                    // horizontal offset from centre
    var yStep = 26 * o.step * S;                            // vertical step down the bow
    var rot = o.side * ROT[o.step-1];                       // outward rotation
    d.style.transform = 'translate(-50%,-50%) translate('+x+'px,'+yStep+'px) rotate('+rot+'deg) scale(1)';
    d.style.opacity = '1';
    d.style.zIndex = String(3 - o.step);                    // inner cards above outer, all below card(z4)
  }
  /* inner pair first, then outward -- the stack opens from the middle */
  var seq = cards.slice().sort(function(a,b){ return a._o.step - b._o.step || a._o.side - b._o.side; });
  cards.forEach(function(d){ d.getBoundingClientRect(); });    // commit the collapsed start frame
  /* The last card to leave also starts the CTA's growth, in the same step:
     both run 1.1s on the same curve, so the button reaches 1.2 exactly as the
     fan completes. */
  requestAnimationFrame(function(){ seq.forEach(function(d,i){ later(function(){
    place(d);
    if (i === seq.length - 1) go.classList.add('full');
  }, FAN_STAGGER*i); }); });
}
function fanCard(id){ var d=document.createElement('div'); d.className='fc'; d.innerHTML='<img src="'+imgFor(id)+'">'; return d; }

/* mobile: result eases down to centre, 2x3 grid backfills sequentially.
   The beginning and end are the source's: the card as it was, and the card
   at body.gridding's size. What is new is the journey between them. The
   class change resizes the card in one frame, so the card is measured
   either side of it and then carried from the first box to the second on
   an ease-in-out curve (FLIP) -- starts gently, speeds up, settles gently. */
function gridReveal(){
  var wrap = card.parentNode;                                   // .cardwrap
  var r0 = card.getBoundingClientRect();
  document.body.classList.add('gridding');
  var r1 = card.getBoundingClientRect(), w1 = wrap.getBoundingClientRect();
  var sx = r0.width / r1.width, sy = r0.height / r1.height;
  var dx = (r0.left + r0.width/2) - (r1.left + r1.width/2);
  var dy = (r0.top + r0.height/2) - (r1.top + r1.height/2);
  wrap.style.transformOrigin = ((r1.left + r1.width/2) - w1.left) + 'px ' + ((r1.top + r1.height/2) - w1.top) + 'px';
  wrap.style.transition = 'none';
  wrap.style.transform = 'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')';
  wrap.getBoundingClientRect();                                 // commit the start frame
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    wrap.style.transition = 'transform '+SHRINK_MS+'ms cubic-bezier(.65,0,.35,1)';
    wrap.style.transform = 'none';
  }); });

  var g=document.getElementById('mgrid'); g.innerHTML='';
  FAN.concat(MOSAIC_MORE).forEach(function(id,i){ var c=document.createElement('div'); c.className='gc'; c.setAttribute('data-flip',id); c.innerHTML='<img src="'+imgFor(id)+'">'; g.appendChild(c);
    later(function(){ c.classList.add('in'); }, 120*i); });
}

/* PORTED VERBATIM from public/portraits.html:6414-6467 -- the proven Portraits
   fitting: fitSourceForUpload and its three constants, byte for byte. It reads
   SRC.b64 / SRC.dataUrl, which this page keeps in the same shape. The photograph
   is fitted ONCE, here; the intake, the reveal and Discovery all get these same
   bytes and none of them re-encodes it. */
  /* ---- fitting a photograph to the wire ----------------------------------
     Vercel's request body ceiling is 4.5MB and is not ours to raise. base64
     inflates by roughly a third, so the practical limit on the file itself
     is about 3.3MB.

     A face at 2048px on the long edge is well past what the generator
     needs -- it returns 1024 square -- so nothing a customer can see is
     lost. A 12MB photograph comes out around 800KB.

     A photograph already inside both limits is passed straight through.
     Re-encoding a small JPEG would degrade it for nothing.

     Calls back with (dataUrl, note) on success, (null) if four passes could
     not get it under. `note` is null when nothing was changed, so the
     caller can leave SRC alone. */
  var FIT_MAX_EDGE = 2048;
  var FIT_MAX_B64  = 3300000;          /* ~4.4MB once base64'd */
  var FIT_QUALITY  = [0.9, 0.82, 0.74, 0.66];

  function fitSourceForUpload(probe, done){
    var w = probe.naturalWidth, h = probe.naturalHeight;
    var b64len = (SRC.b64 || '').length;
    var oversize = b64len * 0.75;      /* bytes, near enough */

    if (Math.max(w, h) <= FIT_MAX_EDGE && oversize <= FIT_MAX_B64){
      done(SRC.dataUrl, null);         /* nothing to do, and nothing done */
      return;
    }

    var scale = Math.min(1, FIT_MAX_EDGE / Math.max(w, h));
    var cw = Math.round(w * scale), ch = Math.round(h * scale);

    var c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    var ctx = c.getContext('2d');
    if (!ctx){ done(SRC.dataUrl, null); return; }   /* no canvas, no change */
    /* Browsers have applied EXIF rotation on decode since 2020 and this
       draws what was decoded, so a phone portrait stays upright. */
    ctx.drawImage(probe, 0, 0, cw, ch);

    for (var i = 0; i < FIT_QUALITY.length; i++){
      var out;
      try { out = c.toDataURL('image/jpeg', FIT_QUALITY[i]); }
      catch (e){ done(SRC.dataUrl, null); return; }  /* tainted canvas */
      var bytes = (out.length - out.indexOf(',') - 1) * 0.75;
      if (bytes <= FIT_MAX_B64){
        done(out, w + '\u00d7' + h + ' \u2192 ' + cw + '\u00d7' + ch +
                  ' at q' + FIT_QUALITY[i] + ', ' +
                  Math.round(bytes / 1024) + 'KB');
        return;
      }
    }
    done(null);
  }

/* actions
   PRODUCTION: the photograph is read, fitted once, then it becomes the card
   (begin) and the real reveal starts. A file the browser cannot draw, or
   one four passes cannot fit, leaves the opening as it was, so another can
   be chosen. */
function pick(inp){
  var f=inp.files[0]; if(!f) return;
  if (STATE.phase !== 'opening') return;
  var r=new FileReader();
  r.onload=function(){
    var url=String(r.result||'');
    if (url.slice(0,11) !== 'data:image/') { console.warn('[foyer] not an image'); return; }
    SRC.dataUrl=url; SRC.b64=url.split(',')[1]||null;
    var probe=new Image();
    probe.onload=function(){
      fitSourceForUpload(probe, function(fitted, note){
        if (!fitted){ console.warn('[foyer] photograph too large even after fitting'); return; }
        if (note){ SRC.b64=fitted.split(',')[1]||null; SRC.dataUrl=fitted; console.log('[foyer] fitted '+note); }
        begin(SRC.dataUrl);
        reveal();
      });
    };
    probe.onerror=function(){ console.warn('[foyer] the browser could not read that photograph'); };
    probe.src=url;
  };
  r.readAsDataURL(f);
}
var btnUpload=document.getElementById('btnUpload');
if (btnUpload) btnUpload.addEventListener('click',function(){ document.getElementById('file').click(); });
var btnCamera=document.getElementById('btnCamera'), camInput=document.getElementById('cam');
if (btnCamera && camInput){
  btnCamera.addEventListener('click',function(){ camInput.click(); });
  camInput.addEventListener('change',function(){ pick(this); });
}
document.getElementById('file').addEventListener('change',function(){ pick(this); });
document.getElementById('empty').addEventListener('click',function(){ document.getElementById('file').click(); });
/* COME INSIDE & EXPLORE -> /discovery, carrying the fitted photograph and
   the subject the intake detected (foyer-handoff.js) -- never the reveal,
   its effect, or anything owned. A photograph still being examined is
   waited for (seconds): only one the intake passed is handed over. */
go.addEventListener('click',function(){
  if (go.getAttribute('aria-busy') === 'true') return;
  go.setAttribute('aria-busy','true');
  Promise.resolve(FOYER.handoff).catch(function(){}).then(function(){ location.href='/discovery'; });
});

</script></body></html>
