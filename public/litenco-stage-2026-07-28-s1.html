<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liten &amp; Co — Stage Contract — s1 — 2026-07-28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   LITEN & CO — STAGE CONTRACT · s1 · 2026-07-28
   The empty stage. Nothing else lives here.

   This file is the single authority for four things:
       the ground, the stage width, the gutters, the type base.
   Every surface adopts this block verbatim. Nothing downstream may set
   width, margin, max-width or font-size on .ground, .stage or :root.

   WHY THIS EXISTS
   b7 had body{display:flex; gap:40px; justify-content:center}. That made the
   stage a flex item, so width:86% was only a hint — actual width came from
   flex distribution competing with auto margins and a 40px gap. Gutters were
   therefore unpredictable and different at every viewport.
   Here body is a block. The stage's width is simply true.
   ====================================================================== */

/* ---- TOKENS · the only place these numbers appear --------------------- */
:root{
  /* TYPE BASE — 16px, fixed.
     b7 used clamp(12px, 0.38vw + 6px, 15px), which resolved to 13px at
     Rich's viewport. Every rem in the file was then measured against 13,
     so type came out ~20% smaller than specified. That was the recurring
     "fonts are too small" fault since March. It is fixed, not fluid. */
  font-size:16px;

  /* GEOMETRY */
  /* 90% wide, but the gutter never exceeds 100px a side.
     max() picks whichever is wider: 90%, or the full width less 2x100px.
     Below 2000px viewport the 5% gutter is under 100 and 90% governs.
     Above it the gutter holds at 100 and the stage keeps growing. */
  --stage-gutter-max:100px;
  --stage-w:max(90%, calc(100% - (var(--stage-gutter-max) * 2)));
  --mh-h:72px;          /* masthead height, reserved — the masthead is not in this file */

  /* GROUND */
  --ls-tile:900px;      /* limestone tile. larger reads as ground, smaller as slab */
  --ls-wash:.42;        /* vellum laid over the stone. higher = quieter stone */

  /* PALETTE — canonical, do not shadow with near-miss values */
  --ink:#2a241e;  --ink-soft:#5a5248;  --taupe:#aba39a;
  --vellum:#f3ede1; --vellum-100:#f8f4eb; --vellum-200:#f3ecdd; --vellum-300:#e9dec8;
  --limestone:#f1ece3;
  --oxblood:#7d4242; --brass:#75623a; --gold:#b68a53;
  --espresso:#26201a; --coffee-700:#332620;
  --card-line:rgba(196,169,110,.28);
  --hairline:rgba(123,92,58,.20);

  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Manrope',sans-serif;

  --r-card:8px;         /* radius ceiling. 999px only on pills <=72px tall */
}

*{margin:0; padding:0; box-sizing:border-box}

html{ height:100% }

/* body is a BLOCK. Nothing here may make it a flex or grid container —
   that is what broke the geometry in b7. */
body{
  min-height:100%;
  background:var(--limestone);
  color:var(--ink);
  font-family:var(--sans);
  font-size:1rem;
  overflow-x:hidden;
}

/* ---- THE GROUND · edge to edge, behind everything --------------------- */
/* Fixed so it does not scroll away and does not depend on content height.
   Separated from .stage on purpose: percentage background-size on the
   gradients now resolves against the viewport, not against a box that also
   carries a tiled image. That is why the 72% radial read wrong before. */
.ground{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-color:var(--limestone);
  background-image:
    linear-gradient(0deg,
      rgba(241,236,227,var(--ls-wash)), rgba(241,236,227,var(--ls-wash))),
    url("/textures/limestone.png");
  background-repeat:repeat, repeat;
  background-size:auto, var(--ls-tile) var(--ls-tile);
  background-position:center, center;
}

/* atmosphere — its own layer so it can be tuned without touching the stone */
.ground::before{
  content:""; position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 16% 8%,
      rgba(255,255,255,.86) 0%, rgba(255,255,255,.30) 24%, transparent 50%),
    radial-gradient(circle at 86% 24%,
      rgba(211,187,151,.24) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 112%,
      rgba(92,66,40,.13) 0%, transparent 60%),
    linear-gradient(135deg, rgba(255,255,255,.22) 0%, rgba(221,208,189,.14) 42%,
      rgba(255,255,255,.10) 68%, rgba(191,166,130,.11) 100%);
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat;
  background-size:72% 72%, 58% 66%, 100% 58%, cover;
  background-position:top left, top right, bottom center, center;
}

/* grain and the room's inner shadow */
.ground::after{
  content:""; position:absolute; inset:0;
  background-image:url("/textures/noise.png");
  background-repeat:repeat; background-size:240px 240px;
  opacity:.025; mix-blend-mode:multiply;
  box-shadow:inset 0 0 7rem rgba(69,44,29,.045),
             inset 0 1px 0 rgba(255,255,255,.32);
}

/* ---- THE STAGE · 86%, centred, at every width ------------------------- */
.stage{
  position:relative; z-index:1;
  width:var(--stage-w);
  margin-inline:auto;
  min-height:calc(100vh - var(--mh-h));
  padding-block:24px;
}

/* ======================================================================
   MEASUREMENT — this block is NOT part of the contract.
   It exists so the geometry can be verified on the glass and read back.
   Delete everything below this line when adopting the contract.
   ================================================================== */
.rule{
  position:relative; z-index:2;
  height:100%;
  min-height:calc(100vh - var(--mh-h) - 48px);
  border:1px dashed rgba(125,66,66,.45);
  border-radius:var(--r-card);
  display:grid; place-items:center;
  background:rgba(255,255,255,.16);
}
.readout{
  font-family:var(--sans); text-align:center; color:var(--ink);
  background:rgba(250,246,236,.9);
  border:1px solid var(--hairline);
  border-radius:var(--r-card);
  padding:28px 36px;
  box-shadow:0 12px 34px -18px rgba(42,36,30,.4);
}
.readout h1{
  font-family:var(--serif); font-weight:400; font-size:34px;
  line-height:1.1; margin-bottom:6px;
}
.readout p{ font-size:16px; line-height:1.5; color:var(--ink-soft); margin-bottom:18px }
.readout table{ border-collapse:collapse; margin:0 auto; font-size:16px }
.readout td{ padding:5px 14px; text-align:left; border-bottom:1px solid var(--hairline) }
.readout td:first-child{ color:var(--ink-soft) }
.readout td:last-child{ font-variant-numeric:tabular-nums; font-weight:600 }
.readout .ok{ color:#4a6b45 } .readout .bad{ color:var(--oxblood) }
</style>
</head>
<body>

<div class="ground" aria-hidden="true"></div>

<div class="stage">
  <div class="rule">
    <div class="readout">
      <h1>Stage Contract &middot; s1</h1>
      <p>The dashed edge is the stage. The stone runs to the page edge behind it.</p>
      <table>
        <tr><td>viewport</td><td id="vw">—</td></tr>
        <tr><td>stage width</td><td id="sw">—</td></tr>
        <tr><td>gutter each side</td><td id="gut">—</td></tr>
        <tr><td>gutter expected</td><td id="gex">—</td></tr>
        <tr><td>stage as % of viewport</td><td id="pct">—</td></tr>
        <tr><td>root font-size</td><td id="fs">—</td></tr>
        <tr><td>body display</td><td id="bd">—</td></tr>
      </table>
    </div>
  </div>
</div>

<script>
/* measurement only — not part of the contract */
(function(){
  function read(){
    var st = document.querySelector('.stage');
    var r  = st.getBoundingClientRect();
    var vw = document.documentElement.clientWidth;
    var pct = (r.width / vw) * 100;
    var fs  = getComputedStyle(document.documentElement).fontSize;
    var bd  = getComputedStyle(document.body).display;
    document.getElementById('vw').textContent  = vw + ' px';
    document.getElementById('sw').textContent  = r.width.toFixed(1) + ' px';
    document.getElementById('gut').textContent = r.left.toFixed(1) + ' px';
    document.getElementById('gex').textContent =
      Math.min(vw * 0.05, 100).toFixed(1) + ' px';
    var p = document.getElementById('pct');
    p.textContent = pct.toFixed(2) + ' %';
    var wantGut = Math.min(vw * 0.05, 100);
    p.className = Math.abs(r.left - wantGut) < 1.5 ? 'ok' : 'bad';
    var f = document.getElementById('fs');
    f.textContent = fs;
    f.className = fs === '16px' ? 'ok' : 'bad';
    var b = document.getElementById('bd');
    b.textContent = bd;
    b.className = bd === 'block' ? 'ok' : 'bad';
  }
  read();
  addEventListener('resize', read);
})();
</script>
</body>
</html>
